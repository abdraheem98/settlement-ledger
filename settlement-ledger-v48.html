<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1>Settlement ledger V44</h1>
      <p class="subtitle">Amazon &amp; Flipkart profit/loss · separate platform workflows in one application</p>
    </div>
    <span class="stamp" id="reportCount">0 reports on file</span>
  </header>

  <nav class="app-nav" id="appNav">
    <button type="button" class="nav-item active" data-page="dashboard">Dashboard</button>
    <button type="button" class="nav-item" data-page="amazon">Amazon</button>
    <button type="button" class="nav-item" data-page="flipkart">Flipkart</button>
    <button type="button" class="nav-item" data-page="manage">Manage</button>
    <span class="nav-caption">Choose a page</span>
  </nav>
  <div id="mainArea"></div>

  <footer>Numbers are computed locally from the files you upload &middot; report data stays in this browser</footer>
</div>

<script>
(function(){

// ---------- utilities ----------
function fmtINR(n){
  if(n===null||n===undefined||isNaN(n)) return '\u2014';
  var sign = n < 0 ? '-' : '';
  return sign + '\u20B9' + Math.round(Math.abs(n)).toLocaleString('en-IN');
}
function fmtNum(n){ return Math.round(n).toLocaleString('en-IN'); }
function pad2(n){ return String(n).padStart(2,'0'); }
function toISO(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function fmtLabel(iso){
  var d = new Date(iso+'T00:00:00');
  var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[d.getMonth()]+' '+d.getDate();
}
function parseAmazonDate(str){
  var s = String(str || '').trim();
  if(!s) return new Date(NaN);
  // Amazon flat files commonly use DD.MM.YYYY, while older exports may use
  // DD/MM/YYYY or an ISO-like date. Ignore the time portion.
  var datePart = s.split(/\s+/)[0];
  var parts = datePart.split(/[.\/\-]/);
  if(parts.length === 3){
    var a = parseInt(parts[0],10), b = parseInt(parts[1],10), c = parseInt(parts[2],10);
    if(String(parts[0]).length === 4) return new Date(a, b-1, c);
    return new Date(c, b-1, a);
  }
  var d = new Date(s);
  return d;
}
function findRow(rows, label){
  for(var i=0;i<rows.length;i++){
    if(rows[i] && String(rows[i][0]||'').trim() === label) return rows[i];
  }
  return null;
}
function num(v){
  var n = parseFloat(v);
  return isNaN(n) ? 0 : n;
}
function platLabel(pf){ return pf === 'amazon' ? 'Amazon' : 'Flipkart'; }

// ---------- browser storage (IndexedDB) ----------
// The original Claude Artifact used window.storage, which only exists inside
// the artifact environment. This hosted version uses IndexedDB instead, so
// the app works on a normal website without a backend or database server.
var DB_NAME = 'settlement-ledger';
var DB_VERSION = 1;
var STORE_NAME = 'kv';

function openDB(){
  return new Promise(function(resolve, reject){
    if(!window.indexedDB){ reject(new Error('IndexedDB is not supported by this browser.')); return; }
    var req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = function(){
      var db = req.result;
      if(!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME);
    };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error || new Error('Could not open local database.')); };
  });
}
async function dbGet(key){
  var db = await openDB();
  return new Promise(function(resolve, reject){
    var tx = db.transaction(STORE_NAME, 'readonly');
    var req = tx.objectStore(STORE_NAME).get(key);
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  }).finally(function(){ db.close(); });
}
async function dbSet(key, value){
  var db = await openDB();
  return new Promise(function(resolve, reject){
    var tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).put(value, key);
    tx.oncomplete = function(){ resolve(); };
    tx.onerror = function(){ reject(tx.error); };
  }).finally(function(){ db.close(); });
}
async function dbDelete(key){
  var db = await openDB();
  return new Promise(function(resolve, reject){
    var tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).delete(key);
    tx.oncomplete = function(){ resolve(); };
    tx.onerror = function(){ reject(tx.error); };
  }).finally(function(){ db.close(); });
}

var INDEX_KEY = 'report_index';

async function loadIndex(){
  try{
    var r = await dbGet(INDEX_KEY);
    return r ? JSON.parse(r) : [];
  }catch(e){ return []; }
}
async function saveIndex(idx){
  await dbSet(INDEX_KEY, JSON.stringify(idx));
}
async function saveReport(report, replaceKey){
  var key = replaceKey || ('report:' + report.platform + ':' + report.periodStart + '_' + report.periodEnd + '_' + Date.now());
  await dbSet(key, JSON.stringify(report));
  var idx = await loadIndex();
  if(replaceKey){ idx = idx.filter(function(e){ return e.key !== replaceKey; }); }
  idx.push({ key:key, platform:report.platform, periodStart:report.periodStart, periodEnd:report.periodEnd, net:report.totals.net, uploadedAt:report.uploadedAt });
  idx.sort(function(a,b){ return a.periodStart.localeCompare(b.periodStart) || a.uploadedAt.localeCompare(b.uploadedAt); });
  await saveIndex(idx);
  return key;
}
async function loadReport(key){
  try{
    var r = await dbGet(key);
    return r ? JSON.parse(r) : null;
  }catch(e){ return null; }
}
async function deleteReport(key){
  try{ await dbDelete(key); }catch(e){}
  var idx = await loadIndex();
  idx = idx.filter(function(e){ return e.key !== key; });
  await saveIndex(idx);
}

var COST_KEY = 'cost_catalog';
var OTHER_CHARGES_KEY = 'other_charges_catalog';
async function loadCostCatalog(){
  try{
    var r = await dbGet(COST_KEY);
    return r ? JSON.parse(r) : {};
  }catch(e){ return {}; }
}
async function saveCostCatalog(catalog){
  try{ await dbSet(COST_KEY, JSON.stringify(catalog)); }catch(e){}
}
async function loadOtherCharges(){
  try{ var r = await dbGet(OTHER_CHARGES_KEY); return r ? JSON.parse(r) : {}; }catch(e){ return {}; }
}
async function saveOtherCharges(charges){
  try{ await dbSet(OTHER_CHARGES_KEY, JSON.stringify(charges)); }catch(e){}
}
function getCostAtDate(name,date){
  var cost=parseFloat(state.costCatalog[name]);
  return isFinite(cost) && cost>=0 ? cost : null;
}
function getOtherCharge(name){
  var v=parseFloat(state.otherChargesCatalog[name]);
  return isFinite(v) && v>=0 ? v : 0;
}
function getEffectiveCost(name,date,visited){
  visited=visited||{};
  if(visited[name]) return null;
  visited[name]=true;
  var comps=state.combos[name];
  if(comps && comps.length){
    var total=0;
    for(var i=0;i<comps.length;i++){
      var cc=getEffectiveCost(comps[i].component,date,Object.assign({},visited));
      if(cc===null) return null;
      total += cc * (parseFloat(comps[i].qty)||0);
    }
    return total;
  }
  var base=getCostAtDate(name,date);
  if(base===null) return null;
  return base;
}
function getLatestCost(name){ return getCostAtDate(name); }


// Compatibility alias used by older UI handlers.
var saveCosts = saveCostCatalog;
var GROUPS_KEY = 'product_groups';
function rawKey(platform, name){ return platform + '::' + name; }
function groupNameFor(rk, fallbackName){
  var g = state.productGroups[rk];
  return (g && g.trim()) ? g.trim() : fallbackName;
}
async function loadGroups(){
  try{
    var r = await dbGet(GROUPS_KEY);
    return r ? JSON.parse(r) : {};
  }catch(e){ return {}; }
}
async function saveGroups(groups){
  try{ await dbSet(GROUPS_KEY, JSON.stringify(groups)); }catch(e){}
}

var PENDING_GROUPS_KEY = 'pending_group_rules';
async function loadPendingGroups(){
  try{
    var r = await dbGet(PENDING_GROUPS_KEY);
    return r ? JSON.parse(r) : [];
  }catch(e){ return []; }
}
async function savePendingGroups(rules){
  try{ await dbSet(PENDING_GROUPS_KEY, JSON.stringify(rules)); }catch(e){}
}

// Parses lines like "raw name 1, raw name 2 => Group Name" (the "=> Group Name"
// part is optional; if omitted, the first raw name on the line becomes the
// group name). Matches each raw name case-insensitively against every listing
// seen across every cached report, on either platform. Names that don't match
// anything yet are kept as pending rules and applied automatically the moment
// a future upload contains that listing (see reconcilePendingGroups).
function findRawKeyByName(rawName){
  var target = rawName.trim().toLowerCase();
  var found = null;
  Object.keys(state.cache).forEach(function(k){
    if(found) return;
    var rep = state.cache[k];
    if(!rep) return;
    rep.products.forEach(function(p){
      if(found) return;
      if(p.name.trim().toLowerCase() === target){
        found = rawKey(rep.platform, p.name);
      }
    });
  });
  return found;
}
function applyBulkGroups(text){
  var matched = [], unmatched = [];
  text.split('\n').forEach(function(line){
    line = line.trim();
    if(!line) return;
    var parts = line.split('=>');
    var namesPart = parts[0];
    var explicitGroup = parts[1] ? parts[1].trim() : null;
    var names = namesPart.split(',').map(function(n){ return n.trim(); }).filter(Boolean);
    if(!names.length) return;
    var groupName = explicitGroup || names[0];
    names.forEach(function(n){
      var rk = findRawKeyByName(n);
      if(rk){
        state.productGroups[rk] = groupName;
        matched.push(n + ' \u2192 ' + groupName);
      } else {
        var existing = state.pendingGroupRules.filter(function(r){ return r.name.toLowerCase() !== n.toLowerCase(); });
        existing.push({ name:n, group:groupName });
        state.pendingGroupRules = existing;
        unmatched.push(n);
      }
    });
  });
  return { matched:matched, unmatched:unmatched };
}
// Runs after every refresh: checks whether any pending rule's listing name has
// now appeared in the cached data (e.g. from a newly uploaded report) and, if
// so, applies the grouping and removes it from the pending list.
function reconcilePendingGroups(){
  if(!state.pendingGroupRules.length) return { applied:[] };
  var stillPending = [], applied = [];
  state.pendingGroupRules.forEach(function(rule){
    var rk = findRawKeyByName(rule.name);
    if(rk){
      state.productGroups[rk] = rule.group;
      applied.push(rule.name + ' \u2192 ' + rule.group);
    } else {
      stillPending.push(rule);
    }
  });
  state.pendingGroupRules = stillPending;
  return { applied:applied };
}

// A combo's cost/unit is derived from its components rather than entered directly.
// Cycle guard included as defense-in-depth even though the editor UI only offers
// non-combo products as valid components.
function getEffectiveCost(name, date, visited){
  visited = visited || {};
  if(visited[name]) return null;
  visited[name] = true;
  var comps = state.combos[name];
  if(!comps || !comps.length){
    var base=getCostAtDate(name, date || toISO(new Date()));
    if(base===null) return null;
    return base;
  }
  var total = 0;
  for(var i=0;i<comps.length;i++){
    var cc = getEffectiveCost(comps[i].component, date, Object.assign({}, visited));
    if(cc === null) return null;
    total += cc * (parseFloat(comps[i].qty) || 0);
  }
  return total;
}

// ---------- Amazon parser ----------
// Amazon settlement rows aren't only "Order Payment" — they also carry Refund,
// Fulfillment Fee Refund, Inventory Reimbursement and Other rows. For P/L we use
// ONLY Deferred -> Order Payment -> Total (INR). Product charges are kept
// separately because they are the best available signal for detecting multi-item
// orders: Amazon can show only one product name on a combo settlement row while
// the Total product charges equals the sum of the actual items in the order.
//
// Important: this is a suggestion engine, not a blind guess. Exact/near-exact
// matches can be auto-resolved; ambiguous orders remain visible for confirmation.
function inferAmazonPriceProfiles(orderMap){
  // Learn a representative SINGLE-UNIT product-charge price from orders where
  // Amazon showed only one product. High-value outliers are often quantity > 1,
  // so exclude observations that are much larger than the normal price before
  // building the profile.
  var byProduct={};
  Object.keys(orderMap).forEach(function(oid){
    var o=orderMap[oid];
    var names=Object.keys(o.products||{});
    if(names.length!==1 || o.productCharges<=0) return;
    var name=names[0];
    if(!byProduct[name]) byProduct[name]=[];
    byProduct[name].push(o.productCharges);
  });

  var profiles={};
  Object.keys(byProduct).forEach(function(name){
    var vals=byProduct[name].filter(function(v){return isFinite(v)&&v>0;}).sort(function(a,b){return a-b;});
    if(!vals.length) return;
    var med=vals[Math.floor(vals.length/2)];
    // Ignore obvious multi-quantity observations when learning the unit price.
    var singles=vals.filter(function(v){return v<=med*1.45;});
    if(!singles.length) singles=vals.slice();

    // Keep up to three representative price points. This is useful when the
    // same SKU has a few legitimate promotional prices; it also lets a mixed
    // order match the exact prices observed elsewhere in the report.
    var clusters=[];
    singles.forEach(function(v){
      var c=clusters.length?clusters[clusters.length-1]:null;
      if(c && Math.abs(v-c.last)<=2.0){ c.values.push(v); c.last=v; }
      else clusters.push({values:[v],last:v});
    });
    // The overall median is the primary unit-price estimate. Cluster medians
    // are retained only as alternatives for promotional-price matching.
    var profile=[];
    var sortedSingles=singles.slice().sort(function(a,b){return a-b;});
    var primary=sortedSingles[Math.floor(sortedSingles.length/2)];
    profile.push({price:primary,count:sortedSingles.length});
    clusters.sort(function(a,b){return b.values.length-a.values.length || a.values[0]-b.values[0];});
    clusters.slice(0,3).forEach(function(c){
      var a=c.values.slice().sort(function(x,y){return x-y;});
      var price=a[Math.floor(a.length/2)];
      if(!profile.some(function(x){return Math.abs(x.price-price)<0.01;})) profile.push({price:price,count:a.length});
    });
    profiles[name]=profile.slice(0,3);
  });
  return profiles;
}
function inferAmazonOrderComposition(order, priceProfiles){
  if(!order || !order.productCharges || order.productCharges<=0) return null;
  var target=order.productCharges;
  var observed=Object.keys(order.products||{});
  var names=Object.keys(priceProfiles).filter(function(n){
    return priceProfiles[n] && priceProfiles[n].length && priceProfiles[n][0].price>0;
  });
  if(!names.length) return null;

  // Small catalogue: enumerate quantities 0..10 rather than beam-pruning.
  // Beam pruning can discard an exact mixed-product match too early.
  var candidates=[];
  function pushCandidate(parts){
    if(!parts.length) return;
    var sum=parts.reduce(function(a,c){return a+c.qty*c.price;},0);
    var units=parts.reduce(function(a,c){return a+c.qty;},0);
    var distinct=parts.length;
    if(units<1 || units>10) return;
    var error=Math.abs(sum-target)/target;
    // Permit reasonable bundle/quantity discounts.
    if(error>0.08) return;
    var hasHint=parts.some(function(c){return observed.indexOf(c.product)>=0;});
    candidates.push({components:parts.map(function(c){return {product:c.product,qty:c.qty};}),matchedAmount:sum,error:error,hasHint:hasHint,units:units,distinct:distinct});
  }
  function walkProduct(idx, parts, units){
    if(idx>=names.length){ pushCandidate(parts); return; }
    var name=names[idx], prices=priceProfiles[name].slice(0,3), seen={};
    walkProduct(idx+1,parts,units); // q=0
    prices.forEach(function(pr){
      var pk=Math.round(pr.price*100); if(seen[pk]) return; seen[pk]=true;
      for(var q=1;q<=10-units;q++){
        parts.push({product:name,qty:q,price:pr.price});
        walkProduct(idx+1,parts,units+q);
        parts.pop();
      }
    });
  }
  walkProduct(0,[],0);
  candidates.sort(function(a,b){
    return a.error-b.error || (a.hasHint?0:1)-(b.hasHint?0:1) || a.distinct-b.distinct || a.units-b.units;
  });
  if(!candidates.length) return null;
  var best=candidates[0];
  var repeatedHint=best.distinct===1 && best.units>1 && best.hasHint && best.error<=0.08;
  best.autoApply=best.hasHint && (best.error<=0.005 || repeatedHint) && (best.units>1 || best.distinct>1);
  best.confidence=best.error<=0.005?'high':(best.error<=0.04?'medium':'low');
  return best;
}

function parseAmazonCSV(text){
  // Amazon settlement flat file: transaction-type is the authoritative bucket.
  // IMPORTANT: one Order is represented by MANY rows (Principal, tax, fees,
  // TCS/TDS, promotions, etc.). We must aggregate those rows instead of treating
  // each row as a separate sale. Product quantity is counted once per unique
  // order-item-code + SKU.
  var parsed=Papa.parse(text,{header:true,skipEmptyLines:true,delimiter:'\t'}), rows=parsed.data;
  var declaredSettlementTotal=rows.length ? num(rows[0]['total-amount']) : null;
  var orderPayments=[], refunds=[], otherAmounts=[], daily={}, dailyProducts={}, products={}, orderMap={};
  var minD=null,maxD=null;
  function clean(v){return String(v===undefined||v===null?'':v).trim();}
  function addBucket(bucket,r,iso,amount){
    bucket.push({
      date:iso,
      settlementId:clean(r['settlement-id']),
      type:clean(r['transaction-type']),
      orderId:clean(r['order-id']),
      amountType:clean(r['amount-type']),
      description:clean(r['amount-description']),
      amount:amount,
      sku:clean(r['sku']),
      quantity:num(r['quantity-purchased'])||0,
      orderItemCode:clean(r['order-item-code'])
    });
  }
  function ensureProduct(sku){
    if(!products[sku]) products[sku]={name:sku,grossValue:0,refundValue:0,net:0,grossUnits:0,refundUnits:0,netUnits:0,orderCount:0,refundCount:0};
    return products[sku];
  }
  function ensureDailyProduct(iso,sku){
    if(!dailyProducts[iso]) dailyProducts[iso]={};
    if(!dailyProducts[iso][sku]) dailyProducts[iso][sku]={name:sku,grossValue:0,refundValue:0,net:0,grossUnits:0,refundUnits:0,netUnits:0};
    return dailyProducts[iso][sku];
  }
  // Unique item keys prevent the 15-20 financial rows belonging to one item
  // from being counted as 15-20 units.
  var seenOrderItems={}, seenRefundItems={};
  rows.forEach(function(r){
    var ds=clean(r['posted-date']||r['transaction-date']);
    if(!ds) return;
    var d=parseAmazonDate(ds); if(isNaN(d)) return;
    var iso=toISO(d);
    if(!minD||d<minD)minD=d; if(!maxD||d>maxD)maxD=d;

    var type=clean(r['transaction-type']) || 'Other';
    var amount=num(r['amount']);
    if(!isFinite(amount)) amount=0;
    var sku=clean(r['sku']);
    var oid=clean(r['order-id']);
    var itemCode=clean(r['order-item-code']);
    var q=num(r['quantity-purchased'])||0;
    var isOrder=type==='Order';
    var isRefund=type==='Refund';

    if(isOrder) addBucket(orderPayments,r,iso,amount);
    else if(isRefund) addBucket(refunds,r,iso,amount);
    else addBucket(otherAmounts,r,iso,amount);

    if(!daily[iso]) daily[iso]={date:iso,orderPayments:0,refunds:0,otherAmounts:0,net:0,gross:0,fees:0,byType:{}};
    var bucket=isOrder?'orderPayments':(isRefund?'refunds':'otherAmounts');
    daily[iso][bucket]+=amount;
    daily[iso].net=daily[iso].orderPayments+daily[iso].refunds+daily[iso].otherAmounts;
    daily[iso].gross=daily[iso].orderPayments;
    daily[iso].byType[type]=(daily[iso].byType[type]||0)+amount;
    if(clean(r['amount-type'])==='ItemFees') daily[iso].fees += amount;

    if(sku && (isOrder||isRefund)){
      var p=ensureProduct(sku), dp=ensureDailyProduct(iso,sku);
      if(isOrder){
        p.grossValue += amount; p.net += amount;
        dp.grossValue += amount; dp.net += amount;
        var ok=(oid||'NO-ORDER')+'::'+(itemCode||sku);
        if(!seenOrderItems[ok]){
          seenOrderItems[ok]=true;
          var uq=q||1;
          p.grossUnits += uq; p.orderCount += 1;
          dp.grossUnits += uq;
        }
        // Every Order row belongs to the same order item, so keep the exact
        // order-level settlement amount without creating duplicate products.
        if(oid){
          if(!orderMap[oid]) orderMap[oid]={id:oid,date:iso,net:0,productCharges:0,products:{},rowCount:0};
          orderMap[oid].net += amount;
          orderMap[oid].rowCount += 1;
          if(!orderMap[oid].products[sku]) orderMap[oid].products[sku]={name:sku,qty:0,net:0,rowCount:0,itemCodes:{}};
          orderMap[oid].products[sku].net += amount;
          orderMap[oid].products[sku].rowCount += 1;
          if(itemCode && !orderMap[oid].products[sku].itemCodes[itemCode]){
            orderMap[oid].products[sku].itemCodes[itemCode]=true;
            orderMap[oid].products[sku].qty += q||1;
          } else if(!itemCode && orderMap[oid].products[sku].qty===0){
            orderMap[oid].products[sku].qty=q||1;
          }
        }
      } else {
        // Refunds are deliberately kept OUT of Order Payments / Order Summary.
        // They belong to the separate Refunds bucket and are only reflected in
        // the product-level refund columns for P/L reconciliation.
        p.refundValue += Math.abs(amount); p.net += amount;
        dp.refundValue += Math.abs(amount); dp.net += amount;
        var rk=(oid||'NO-ORDER')+'::'+(itemCode||sku);
        if(!seenRefundItems[rk]){
          seenRefundItems[rk]=true;
          var rq=q||1;
          p.refundUnits += rq; p.refundCount += 1;
          dp.refundUnits += rq;
        }
      }
    }
  });

  // Finalise net units and daily net units only after all Order/Refund rows have
  // been aggregated. A refund can never create a second sale row.
  Object.keys(products).forEach(function(k){
    var p=products[k];
    p.netUnits=Math.max(0,p.grossUnits-p.refundUnits);
    p.refundRate=p.grossUnits?(p.refundUnits/p.grossUnits*100):0;
    p.rateBasis='units';
  });
  Object.keys(dailyProducts).forEach(function(day){
    Object.keys(dailyProducts[day]).forEach(function(k){
      var p=dailyProducts[day][k];
      p.netUnits=Math.max(0,(p.grossUnits||0)-(p.refundUnits||0));
    });
  });
  Object.keys(orderMap).forEach(function(oid){
    var o=orderMap[oid];
    o.products=Object.keys(o.products).map(function(k){
      var p=o.products[k];
      delete p.itemCodes;
      return p;
    });
    // Order Summary contains ONLY transaction-type=Order amounts.
    o.productCharges=o.net;
  });

  var op=orderPayments.reduce(function(a,r){return a+r.amount},0);
  var rf=refunds.reduce(function(a,r){return a+r.amount},0);
  var ot=otherAmounts.reduce(function(a,r){return a+r.amount},0);
  var productArr=Object.keys(products).map(function(k){return products[k];}).sort(function(a,b){return b.net-a.net;});
  return {
    platform:'amazon', parserVersion:41, flatFileDirectProducts:true,
    rawHeaders:Object.keys(rows[0]||{}), rawRows:rows,
    sourceFormat:'Amazon settlement flat file (tab-separated TXT)', settlementDeclaredTotal:(isFinite(declaredSettlementTotal)?declaredSettlementTotal:null),
    periodStart:minD?toISO(minD):null, periodEnd:maxD?toISO(maxD):null,
    uploadedAt:new Date().toISOString(),
    totals:{
      orderPayments:op, refunds:rf, otherAmounts:ot,
      orderRevenue:op, reimbursements:ot, net:op+rf+ot,
      deferredCount:orderPayments.length, deferredTotal:op,
      fees:rows.reduce(function(a,r){return a+(clean(r['amount-type'])==='ItemFees'?num(r['amount']):0);},0),
      byType:rows.reduce(function(m,r){var t=clean(r['transaction-type'])||'Other';m[t]=(m[t]||0)+num(r['amount']);return m;},{}),
      bucketCounts:{orderPayments:orderPayments.length,refunds:refunds.length,otherAmounts:otherAmounts.length}
    },
    buckets:{orderPayments:orderPayments,refunds:refunds,otherAmounts:otherAmounts},
    daily:Object.keys(daily).sort().map(function(k){return daily[k];}),
    dailyProducts:dailyProducts,
    products:productArr,
    orders:Object.keys(orderMap).map(function(k){return orderMap[k];})
  };
}

// ---------- Flipkart parser ----------
// Flipkart's own Overall Summary sheet already separates Gross Sales, RTO,
// RVP (customer returns), Cancellations, Total Expenses, Rewards & Other
// Benefits and Input Tax Credits — pulled directly rather than re-derived,
// since Flipkart's own categorisation is the accurate source of truth.
function parseFlipkartXLSX(arrayBuffer){
  var wb = XLSX.read(arrayBuffer, { type:'array', cellDates:true });

  var summarySheet = wb.Sheets['Overall Summary'];
  var ordersSheet = wb.Sheets['Orders P&L'];
  var skuSheet = wb.Sheets['SKU-level P&L'];
  if(!summarySheet || !ordersSheet || !skuSheet){
    throw new Error('MISSING_SHEETS');
  }

  var summaryRows = XLSX.utils.sheet_to_json(summarySheet, { header:1 });
  var periodRow = findRow(summaryRows, 'Orders Recieved During:');
  var periodStart, periodEnd;
  if(periodRow && periodRow[1]){
    var parts = String(periodRow[1]).split(' to ');
    periodStart = parts[0].trim();
    periodEnd = (parts[1]||parts[0]).trim();
  }
  var grossRow = findRow(summaryRows, 'Gross Sales');
  var returnsRow = findRow(summaryRows, 'Returns and Cancellations');
  var rtoRow = findRow(summaryRows, '\u2022 RTO (Logistics Return)');
  var rvpRow = findRow(summaryRows, '\u2022 RVP (Customer Return)');
  var cancelRow = findRow(summaryRows, '\u2022 Cancelled');
  var expensesRow = findRow(summaryRows, 'Total Expenses');
  var rewardsRow = findRow(summaryRows, 'Rewards & Other Benefits');
  var itcRow = findRow(summaryRows, 'Input Tax Credits');
  var earningsRow = findRow(summaryRows, 'Earnings on Platform');

  var grossSales = grossRow ? num(grossRow[1]) : 0;
  var returns = returnsRow ? Math.abs(num(returnsRow[1])) : 0;
  var rto = rtoRow ? Math.abs(num(rtoRow[1])) : 0;
  var rvp = rvpRow ? Math.abs(num(rvpRow[1])) : 0;
  var cancelled = cancelRow ? Math.abs(num(cancelRow[1])) : 0;
  var expenses = expensesRow ? Math.abs(num(expensesRow[1])) : 0;
  var rewards = rewardsRow ? num(rewardsRow[1]) : 0;
  var itc = itcRow ? num(itcRow[1]) : 0;
  var net = earningsRow ? num(earningsRow[1]) : 0;

  // Daily breakdown from Orders P&L (order-level rows)
  var ordersJson = XLSX.utils.sheet_to_json(ordersSheet, { header:1 });
  var header = ordersJson[0];
  var dateIdx = header.indexOf('Order Date');
  var statusIdx = header.indexOf('Order Status');
  var netEarnIdx = header.indexOf('Net Earnings (INR)');
  var orderValIdx = header.indexOf('Order Item Value');
  var returnedUnitsIdx = header.indexOf('Returned & Cancelled Units');
  var skuOrderIdx = header.indexOf('SKU ID');
  var expensesOrderIdx = header.indexOf('Total Expenses');
  var rewardsOrderIdx = header.indexOf('Rewards & Other Benefits');
  var itcOrderIdx = header.indexOf('Input Tax Credits');
  var dailyProducts = {};
  var orderDetails = [];
  var refundCancellationRows = [];

  var daily = {};
  for(var i=2;i<ordersJson.length;i++){
    var row = ordersJson[i];
    if(!row || row[dateIdx]===undefined || row[dateIdx]===null || row[dateIdx]==='') continue;
    var dateVal = row[dateIdx];
    var iso;
    if(dateVal instanceof Date){ iso = toISO(dateVal); }
    else { iso = String(dateVal).slice(0,10); }
    if(!daily[iso]) daily[iso] = { date:iso, gross:0, fees:0, refunds:0, net:0, expenses:0, rewards:0, itc:0 };
    var orderVal = num(row[orderValIdx]);
    var netEarn = num(row[netEarnIdx]);
    var returnedUnits = num(row[returnedUnitsIdx]);
    var status = String(row[statusIdx]||'').toUpperCase();
    var isReturn = returnedUnits > 0 || status.indexOf('CANCEL') >= 0 || status.indexOf('RTO') >= 0 || status.indexOf('RVP') >= 0 || status.indexOf('RETURN') >= 0;
    var orderRecord = {date:iso, orderId:String(row[header.indexOf('Order ID')]||''), sku:skuOrderIdx>=0?String(row[skuOrderIdx]||'').trim():'', status:status, orderItemValue:orderVal, netEarnings:netEarn, returnedUnits:returnedUnits};
    if(isReturn){ refundCancellationRows.push(orderRecord); } else { orderDetails.push(orderRecord); }

    daily[iso].net += netEarn;
    if(expensesOrderIdx >= 0) daily[iso].expenses += Math.abs(num(row[expensesOrderIdx]));
    if(rewardsOrderIdx >= 0) daily[iso].rewards += num(row[rewardsOrderIdx]);
    if(itcOrderIdx >= 0) daily[iso].itc += num(row[itcOrderIdx]);
    var skuName = skuOrderIdx >= 0 ? String(row[skuOrderIdx]||'').trim() : '';
    if(skuName){
      if(!dailyProducts[iso]) dailyProducts[iso] = {};
      if(!dailyProducts[iso][skuName]) dailyProducts[iso][skuName] = { name:skuName, grossValue:0, refundValue:0, net:0, grossUnits:0, netUnits:0, returnedUnits:0 };
      dailyProducts[iso][skuName].net += netEarn;
      if(isReturn){ dailyProducts[iso][skuName].refundValue += Math.abs(orderVal); dailyProducts[iso][skuName].returnedUnits += returnedUnits; }
      else { dailyProducts[iso][skuName].grossValue += orderVal; dailyProducts[iso][skuName].grossUnits += Math.max(0, returnedUnits ? 0 : 1); }
      dailyProducts[iso][skuName].netUnits = Math.max(0, dailyProducts[iso][skuName].grossUnits - dailyProducts[iso][skuName].returnedUnits);
    }
    if(isReturn){
      daily[iso].refunds += orderVal;
    } else {
      daily[iso].gross += orderVal;
    }
  }
  var dailyArr = Object.keys(daily).sort().map(function(k){ return daily[k]; });

  // Product breakdown from SKU-level P&L
  var skuJson = XLSX.utils.sheet_to_json(skuSheet, { header:1 });
  var skuHeader = skuJson[0];
  var idIdx = skuHeader.indexOf('SKU ID');
  var grossUnitsIdx = skuHeader.indexOf('Gross Units (#)');
  var netUnitsIdx = skuHeader.indexOf('Net Units (#)');
  var retUnitsIdx = skuHeader.indexOf('Returned & Cancelled Units');
  var orderItemValIdx = skuHeader.indexOf('Sum of Order Item Value');
  var netEarnSkuIdx = skuHeader.indexOf('Net Earnings (INR)');

  var products = [];
  for(var j=1;j<skuJson.length;j++){
    var srow = skuJson[j];
    if(!srow || !srow[idIdx]) continue;
    var grossUnits = num(srow[grossUnitsIdx]);
    var netUnitsVal = netUnitsIdx >= 0 ? num(srow[netUnitsIdx]) : grossUnits;
    var retUnits = num(srow[retUnitsIdx]);
    var grossValue = num(srow[orderItemValIdx]);
    var netVal = num(srow[netEarnSkuIdx]);
    products.push({
      name: String(srow[idIdx]),
      grossValue: grossValue,
      refundValue: null,
      net: netVal,
      grossUnits: grossUnits,
      netUnits: netUnitsVal,
      returnedUnits: retUnits,
      refundRate: grossUnits > 0 ? (retUnits/grossUnits*100) : 0,
      rateBasis: 'units'
    });
  }
  products.sort(function(a,b){ return b.grossValue - a.grossValue; });

  if(!periodStart){
    var isos = dailyArr.map(function(d){ return d.date; }).sort();
    periodStart = isos[0]; periodEnd = isos[isos.length-1];
  }

  var otherCharges = [
    {type:'Expenses', amount:-Math.abs(expenses), description:'Total Expenses'},
    {type:'Rewards & Other Benefits', amount:rewards, description:'Rewards & Other Benefits'},
    {type:'Input Tax Credits', amount:itc, description:'Input Tax Credits'}
  ].filter(function(x){ return Math.abs(x.amount)>0.0001; });

  return {
    platform:'flipkart',
    periodStart: periodStart,
    periodEnd: periodEnd,
    uploadedAt: new Date().toISOString(),
    totals: {
      grossSales:grossSales, returns:returns, rto:rto, rvp:rvp, cancelled:cancelled,
      expenses:expenses, rewards:rewards, itc:itc, net:net
    },
    daily: dailyArr,
    dailyProducts: dailyProducts,
    products: products,
    orderDetails: orderDetails,
    refundCancellationRows: refundCancellationRows,
    otherCharges: otherCharges
  };
}

var state = { history:[], cache:{}, costCatalog:{}, otherChargesCatalog:{}, productGroups:{}, pendingGroupRules:[], combos:{}, orderCompositions:{}, editingCombo:null, comboDraft:null, comboSuggestions:null, manageTab:'orders', showManage:false, bulkGroupResult:null, reconciledNote:null, selected:{ amazon:null, flipkart:null }, filter:{ mode:'all', month:null, year:null, from:null, to:null }, editingOrder:null, orderDraft:null, orderOtherCharge:0, orderBenchmarkProfit:'', editingCost:null, costDraft:null };

// ---------- date filter ----------
function computeRange(){
  var f = state.filter;
  if(f.mode === 'month' && f.month){
    var y = parseInt(f.month.slice(0,4),10), m = parseInt(f.month.slice(5,7),10);
    var lastDay = new Date(y, m, 0);
    return { from: f.month + '-01', to: toISO(lastDay) };
  }
  if(f.mode === 'year' && f.year){
    return { from: f.year + '-01-01', to: f.year + '-12-31' };
  }
  if(f.mode === 'custom' && f.from && f.to){
    return { from: f.from, to: f.to };
  }
  return null;
}
function reportOverlaps(e, range){
  if(!range) return true;
  return e.periodEnd >= range.from && e.periodStart <= range.to;
}
function dateInRange(date, range){
  return !range || (date >= range.from && date <= range.to);
}
function filteredDaily(rep, range){
  if(!range) return (rep.daily || []).slice();
  return (rep.daily || []).filter(function(d){ return dateInRange(d.date, range); });
}
function filteredProducts(rep, range){
  if(!rep.dailyProducts){
    return (rep.products || []).map(function(p){
      var copy=Object.assign({},p);
      var units=copy.netUnits !== undefined ? copy.netUnits : (copy.grossUnits || 0);
      var groupName=groupNameFor(rawKey(rep.platform,copy.name),copy.name);
      var cost=getEffectiveCost(groupName,rep.periodStart);
      copy.cogs=0; copy.costedUnits=0; copy.missingUnits=0;
      if(cost===null) copy.missingUnits=units;
      else { copy.cogs=cost*units; copy.costedUnits=units; }
      return copy;
    });
  }
  var map = {};
  filteredDaily(rep, range).forEach(function(d){
    var day = rep.dailyProducts[d.date] || {};
    Object.keys(day).forEach(function(name){
      var p = day[name];
      if(!map[name]) map[name] = { name:name, grossValue:0, refundValue:0, net:0, grossUnits:0, refundUnits:0, returnedUnits:0, netUnits:0 };
      map[name].grossValue += p.grossValue || 0;
      map[name].refundValue += p.refundValue || 0;
      map[name].net += p.net || 0;
      map[name].grossUnits += p.grossUnits || 0;
      map[name].refundUnits += p.refundUnits || p.returnedUnits || 0;
      map[name].returnedUnits += p.returnedUnits || p.refundUnits || 0;
      map[name].netUnits += p.netUnits || 0;
    });
  });
  return Object.keys(map).map(function(name){
    var p = map[name];
    p.refundRate = p.grossValue > 0 ? (p.refundValue / p.grossValue * 100) : (p.grossUnits > 0 ? (p.returnedUnits / p.grossUnits * 100) : 0);
    p.rateBasis = rep.platform === 'flipkart' ? 'units' : 'value';
    p.cogs = 0;
    p.costedUnits = 0;
    p.missingUnits = 0;
    if(rep.dailyProducts){
      Object.keys(rep.dailyProducts).forEach(function(day){
        if(!dateInRange(day, range)) return;
        var dp=rep.dailyProducts[day] && rep.dailyProducts[day][name];
        if(!dp) return;
        var units = dp.netUnits !== undefined ? dp.netUnits : (dp.grossUnits || 0);
        if(units <= 0) return;
        var groupName=groupNameFor(rawKey(rep.platform,name),name);
        var cost=getEffectiveCost(groupName,day);
        if(cost===null) p.missingUnits += units;
        else { p.cogs += cost*units; p.costedUnits += units; }
      });
    } else {
      var unitsLegacy=p.netUnits !== undefined ? p.netUnits : (p.grossUnits || 0);
      var groupLegacy=groupNameFor(rawKey(rep.platform,name),name);
      var legacyCost=getEffectiveCost(groupLegacy,rep.periodStart);
      if(legacyCost===null) p.missingUnits += unitsLegacy;
      else { p.cogs += legacyCost*unitsLegacy; p.costedUnits += unitsLegacy; }
    }
    return p;
  }).sort(function(a,b){ return b.grossValue-a.grossValue; });
}
function filteredTotals(rep, range){
  if(!range) return JSON.parse(JSON.stringify(rep.totals));
  var days = filteredDaily(rep, range);
  if(!days.length) return null;
  if(rep.platform === 'amazon'){
    var t = {orderRevenue:0, orderPayments:0, refunds:0, otherAmounts:0, reimbursements:0, fees:0, byType:{}, net:0, deferredCount:0, deferredTotal:0};
    days.forEach(function(d){
      t.orderRevenue += d.orderPayments || 0;
      t.orderPayments += d.orderPayments || 0;
      t.refunds += d.refunds || 0;
      t.otherAmounts += d.otherAmounts || 0;
      t.reimbursements += d.otherAmounts || 0;
      t.fees += d.fees || 0;
      t.net += d.net || 0;
      Object.keys(d.byType || {}).forEach(function(type){
        var v = d.byType[type] || 0;
        t.byType[type] = (t.byType[type]||0) + v;
      });
    });
    t.deferredTotal = t.orderRevenue;
    t.deferredCount = 0;
    return t;
  }
  var t2 = {grossSales:0, returns:0, rto:0, rvp:0, cancelled:0, expenses:0, rewards:0, itc:0, net:0};
  days.forEach(function(d){ t2.grossSales += d.gross||0; t2.returns += d.refunds||0; t2.expenses += d.expenses||0; t2.rewards += d.rewards||0; t2.itc += d.itc||0; t2.net += d.net||0; });
  // Daily Orders P&L does not always expose RTO/RVP/cancellation amounts separately.
  // Keep the exact report-level breakdown only for full-report views; for a partial range
  // use the order-level returns bucket and leave sub-breakdowns at zero rather than inventing them.
  return t2;
}
function rangeLabel(range){
  if(!range) return 'All time';
  return range.from + ' \u2192 ' + range.to;
}
function buildAvailablePeriods(){
  var months = {}, years = {};
  Object.keys(state.cache).forEach(function(k){
    var rep = state.cache[k];
    if(!rep || !rep.daily) return;
    rep.daily.forEach(function(d){

      years[d.date.slice(0,4)] = true;
    });
  });
  return {
    months: Object.keys(months).sort(),
    years: Object.keys(years).sort()
  };
}
function monthLabel(ym){
  var names=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var y = ym.slice(0,4), m = parseInt(ym.slice(5,7),10);
  return names[m-1] + ' ' + y;
}

async function exportBackup(){
  var reports = {};
  state.history.forEach(function(e){
    if(state.cache[e.key]) reports[e.key] = state.cache[e.key];
  });
  var data = {
    exportedAt: new Date().toISOString(),
    version: 1,
    reportIndex: state.history,
    reports: reports,
    costCatalog: state.costCatalog,
    otherChargesCatalog: state.otherChargesCatalog,
    productGroups: state.productGroups,
    combos: state.combos,
    pendingGroupRules: state.pendingGroupRules,
    orderCompositions: state.orderCompositions
  };
  var blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'settlement-ledger-backup-' + toISO(new Date()) + '.json';
  document.body.appendChild(a);
  a.click();

  URL.revokeObjectURL(url);

// Builds a downloadable .xlsx mirroring what's on screen: one sheet with the
// grouped product-level profit (the main deliverable), plus one summary sheet
// per platform using each platform's own categories, respecting whatever date
// filter is currently selected.
function exportExcel(){
  var range = computeRange();
  var groups = buildMasterGroups(range);
  var wb = XLSX.utils.book_new();

  var productRows = [['Product','Platforms','Units sold','Net earnings (INR)','Cost/unit (INR)','Other charges/unit (INR)','COGS (INR)','True profit (INR)']];
  groups.forEach(function(g){
    var profit = groupProfit(g);
    productRows.push([
      g.name,
      Object.keys(g.platforms).join(', '),
      Math.round(g.units),
      Math.round(g.net),
      profit.hasCost ? profit.cost : '',
      profit.hasCost ? getOtherCharge(g.name) : '',
      profit.hasCost ? Math.round(profit.cogs) : '',
      Math.round(profit.trueProfit)
    ]);
  });
  var wsProducts = XLSX.utils.aoa_to_sheet(productRows);
  wsProducts['!cols'] = [{wch:28},{wch:16},{wch:11},{wch:16},{wch:16},{wch:24},{wch:14},{wch:14}];
  XLSX.utils.book_append_sheet(wb, wsProducts, 'Product profit');

  var at = totalsFor('amazon', range);
  var amazonRows = [
    ['Metric','Amount (INR)'],
    ['Order payments', Math.round(at.orderRevenue)],
    ['Refunds', Math.round(at.refunds)],
    ['Other amounts', Math.round(at.otherAmounts !== undefined ? at.otherAmounts : at.reimbursements)],
    ['  - Fulfillment Fee Refund', Math.round(at.byType['Fulfillment Fee Refund']||0)],
    ['  - Inventory Reimbursement', Math.round(at.byType['Inventory Reimbursement']||0)],
    ['  - Other', Math.round(at.byType['Other']||0)],
    ['Amazon ItemFees total (included in Order payments)', Math.round(at.fees)],
    ['Net settled', Math.round(at.net)]
  ];
  var wsAmazon = XLSX.utils.aoa_to_sheet(amazonRows);
  wsAmazon['!cols'] = [{wch:30},{wch:16}];
  XLSX.utils.book_append_sheet(wb, wsAmazon, 'Amazon summary');

  var ft = totalsFor('flipkart', range);
  var flipkartRows = [
    ['Metric','Amount (INR)'],
    ['Gross sales', Math.round(ft.grossSales)],
    ['Returns & cancellations', -Math.round(ft.returns)],
    ['  - RTO (logistics return)', Math.round(ft.rto)],
    ['  - RVP (customer return)', Math.round(ft.rvp)],
    ['  - Cancelled', Math.round(ft.cancelled)],
    ['Total expenses', -Math.round(ft.expenses)],
    ['Rewards & tax credits', Math.round(ft.rewards+ft.itc)],
    ['Net earnings', Math.round(ft.net)]
  ];
  var wsFlipkart = XLSX.utils.aoa_to_sheet(flipkartRows);
  wsFlipkart['!cols'] = [{wch:30},{wch:16}];
  XLSX.utils.book_append_sheet(wb, wsFlipkart, 'Flipkart summary');

  XLSX.writeFile(wb, 'settlement-ledger-' + toISO(new Date()) + (range ? '-' + range.from + '_' + range.to : '') + '.xlsx');
}

async function importBackupFile(file){
  setBackupStatus('Reading backup file \u2026', true);
  var reader = new FileReader();
  reader.onload = async function(e){
    try{
      var data = JSON.parse(e.target.result);
      if(!data || !data.reportIndex || !data.reports){
        throw new Error('That doesn\'t look like a settlement ledger backup file.');
      }
      var importedReports = 0;
      for(var i=0;i<data.reportIndex.length;i++){
        var entry = data.reportIndex[i];
        var rep = data.reports[entry.key];
        if(rep){
          await dbSet(entry.key, JSON.stringify(rep));
          state.cache[entry.key] = rep;
          importedReports++;
        }
      }

      var idx = await loadIndex();
      var idxKeys = {};
      idx.forEach(function(e){ idxKeys[e.key] = true; });
      data.reportIndex.forEach(function(e){
        if(!idxKeys[e.key]) idx.push(e);
      });
      idx.sort(function(a,b){ return a.periodStart.localeCompare(b.periodStart); });
      await saveIndex(idx);

      state.costCatalog = Object.assign({}, state.costCatalog, data.costCatalog || {});
      state.otherChargesCatalog = Object.assign({}, state.otherChargesCatalog, data.otherChargesCatalog || {});
      state.productGroups = Object.assign({}, state.productGroups, data.productGroups || {});
      state.combos = Object.assign({}, state.combos, data.combos || {});
      state.orderCompositions = Object.assign({}, state.orderCompositions, data.orderCompositions || {});
      var pendingMap = {};
      (state.pendingGroupRules||[]).concat(data.pendingGroupRules||[]).forEach(function(r){
        pendingMap[r.name.toLowerCase()] = r;
      });
      state.pendingGroupRules = Object.keys(pendingMap).map(function(k){ return pendingMap[k]; });

      await saveCostCatalog(state.costCatalog);
      await saveOtherCharges(state.otherChargesCatalog);
      await saveGroups(state.productGroups);
      await saveCombos(state.combos);
      await savePendingGroups(state.pendingGroupRules);
      await saveOrderCompositions(state.orderCompositions);

      setBackupStatus('Restored ' + importedReports + ' report(s), plus cost, grouping and combo data.', true);
      await refresh();
    }catch(err){
      setBackupStatus('Could not restore that file \u2014 ' + err.message, false);
    }
  };
  reader.readAsText(file);
}

async function refresh(){
  state.history = await loadIndex();
  reportCountEl.textContent = state.history.length + (state.history.length === 1 ? ' report on file' : ' reports on file');

  for(var i=0;i<state.history.length;i++){
    var k = state.history[i].key;
    if(!state.cache[k]){
      var rep = await loadReport(k);
      if(rep) state.cache[k] = rep;
    }
  }

  var reconciled = reconcilePendingGroups();
  if(reconciled.applied.length){
    await saveGroups(state.productGroups);
    await savePendingGroups(state.pendingGroupRules);
    state.reconciledNote = reconciled.applied;
  }

  ['amazon','flipkart'].forEach(function(pf){
    var reports = state.history.filter(function(e){ return e.platform === pf; }).sort(function(a,b){ return a.periodStart.localeCompare(b.periodStart); });
    if(reports.length){
      if(!state.selected[pf] || !reports.find(function(e){ return e.key === state.selected[pf]; })){
        state.selected[pf] = reports[reports.length-1].key;
      }
    } else {
      state.selected[pf] = null;
    }
  });

  renderAll();
}

// ---------- Amazon multi-item order review ----------
// Product charges above this threshold are only a review signal. They are NOT
// automatically treated as combos. The seller confirms the actual composition.
var MULTI_ITEM_REVIEW_THRESHOLD = 1500;
function getAmazonMultiItemCandidates(range){
  var out = [];
  state.history.filter(function(e){ return e.platform==='amazon' && reportOverlaps(e, range); }).forEach(function(e){
    var rep = state.cache[e.key];
    if(!rep || !rep.orders) return;
    rep.orders.forEach(function(o){
      var inferred=o.inference;
      var likelyMulti=inferred && inferred.components && (inferred.components.length>1 || inferred.components.some(function(c){return c.qty>1;}));
      // High-confidence matches are already used in the P/L automatically.
      // Only send unresolved/ambiguous orders to the manual review panel.
      if(inferred && inferred.autoApply) return;
      if(o.productCharges <= MULTI_ITEM_REVIEW_THRESHOLD && !likelyMulti) return;
      var key = orderCompositionKey('amazon', o.id);
      if(state.orderCompositions[key]) return;
      out.push({ reportKey:e.key, reportStart:e.periodStart, reportEnd:e.periodEnd, order:o });
    });
  });
  return out.sort(function(a,b){ return b.order.productCharges - a.order.productCharges; });
}
function allMasterProductNames(){
  var names = {};
  state.history.forEach(function(e){

// ---------- order-level P/L rollup ----------
// Amazon profit is calculated order-by-order. Product totals are only a
// summary of those order calculations; they are never used as the primary
// source for total COGS/profit. This preserves multi-product orders exactly.
function getOrderSourceComponents(o){
  var out=[];
  Object.keys(o.products||{}).forEach(function(k){
    var p=o.products[k];
    out.push({product:groupNameFor(rawKey('amazon',p.name),p.name),qty:parseInt(p.qty,10)||1});
  });
  return out;
}
function getOrderCostBreakdown(o){
  var saved=state.orderCompositions[orderCompositionKey('amazon',o.id)];
  var components=[];
  var other=0;
  var isSpecial=!!(saved && saved.components && saved.components.length);
  if(isSpecial){
    components=saved.components.map(function(c){
      return {product:c.product,qty:parseInt(c.qty,10)||1,cost:getEffectiveCost(c.product,o.date)};
    });
    other=parseFloat(saved.otherCharge)||0;
  } else if(o.inference && o.inference.autoApply && o.inference.components && o.inference.components.length){
    // High-confidence parser match: Amazon's Product Details can name only one
    // listing even when the physical order contains multiple items. Use the
    // inferred composition directly, but keep it tied to this report/order.
    components=o.inference.components.map(function(c){
      var product=groupNameFor(rawKey('amazon',c.product),c.product);
      return {product:product,qty:parseInt(c.qty,10)||1,cost:getEffectiveCost(product,o.date)};
    });
  } else {
    components=getOrderSourceComponents(o).map(function(c){
      var cost=getEffectiveCost(c.product,o.date);
      return {product:c.product,qty:c.qty,cost:cost};
    });
    // Ordinary one-product orders use the listing Amazon supplied.
    // Ambiguous multi-product orders remain in the manual Order P/L panel.
  }
  var complete=components.length>0 && components.every(function(c){return isFinite(c.cost) && c.cost>=0;});
  var cogs=complete ? components.reduce(function(sum,c){return sum+c.cost*c.qty;},0)+other : null;
  return {components:components,other:other,complete:complete,cogs:cogs,isSpecial:isSpecial};
}
function amazonOrderRows(range){
  var rows=[];
  state.history.filter(function(e){return e.platform==='amazon' && reportOverlaps(e,range);}).forEach(function(e){
    var rep=state.cache[e.key]; if(!rep || !rep.orders) return;
    rep.orders.forEach(function(o){if(dateInRange(o.date,range)) rows.push({reportKey:e.key,order:o,breakdown:getOrderCostBreakdown(o)});});
  });
  return rows;
}
function ensureGroup(groups,name){
  if(!groups[name]) groups[name]={name:name,units:0,orderPayments:0,refunds:0,net:0,grossValue:0,cogs:0,costedUnits:0,missingUnits:0,platforms:{},listingCount:0,orderCount:0};
  return groups[name];
}
function addGroupPlatform(g,platform){g.platforms[platform]=true;}
function buildAmazonOrderGroups(groups,range){
  // The flat file already gives the actual SKU and quantity. Do not infer combos
  // from price, and do not allocate one order's value across guessed products.
  state.history.filter(function(e){return e.platform==='amazon' && reportOverlaps(e,range);}).forEach(function(e){
    var rep=state.cache[e.key]; if(!rep) return;
    filteredProducts(rep,range).forEach(function(p){
      var gname=groupNameFor(rawKey('amazon',p.name),p.name);
      var g=ensureGroup(groups,gname);
      var units=p.netUnits!==undefined?p.netUnits:(p.grossUnits||0);
      g.units += units;
      g.orderPayments += p.grossValue||0;
      g.refunds += -(p.refundValue||0);
      g.net += p.net||0;
      g.grossValue += p.grossValue||0;
      g.orderCount += p.orderCount||p.grossUnits||0;
      g.listingCount += 1;
      addGroupPlatform(g,'amazon');
      var cost=getEffectiveCost(gname,rep.periodStart);
      if(cost===null) g.missingUnits += units;
      else { g.cogs += cost*units; g.costedUnits += units; }
    });
  });
}
function buildFlipkartGroups(groups,range){
  state.history.filter(function(e){return e.platform==='flipkart' && reportOverlaps(e,range);}).forEach(function(e){
    var rep=state.cache[e.key]; if(!rep) return;
    filteredProducts(rep,range).forEach(function(p){
      var gname=groupNameFor(rawKey(rep.platform,p.name),p.name);
      var g=ensureGroup(groups,gname);
      var units=p.netUnits!==undefined?p.netUnits:(p.grossUnits||0);
      g.units+=units; g.net+=p.net; g.grossValue+=(p.grossValue||0); g.orderCount+=units; g.listingCount+=1; addGroupPlatform(g,'flipkart');
      var cost=getEffectiveCost(gname,rep.periodStart);
      if(cost===null) g.missingUnits+=units; else {g.cogs+=cost*units;g.costedUnits+=units;}
    });
  });
}
function buildMasterGroups(range, platformOnly){
  var groups={};
  if(!platformOnly || platformOnly==='amazon') buildAmazonOrderGroups(groups,range);
  if(!platformOnly || platformOnly==='flipkart') buildFlipkartGroups(groups,range);
  Object.keys(groups).forEach(function(k){
    if(groups[k].units<0) groups[k].units=0;
    if(Math.abs(groups[k].net)<0.005) groups[k].net=0;
    if(groups[k].grossValue<0) groups[k].grossValue=0;
  });
  return Object.keys(groups).map(function(k){return groups[k];}).filter(function(g){return g.units>0 || Math.abs(g.net)>0.005;}).sort(function(a,b){return b.net-a.net;});
}
function getAmazonOrderPLSummary(range){
  var rows=amazonOrderRows(range), revenue=0,cogs=0,unresolved=0,orderCount=0;
  rows.forEach(function(r){
    revenue+=r.order.net||0; orderCount+=1;
    if(r.breakdown.complete) cogs+=r.breakdown.cogs||0; else unresolved+=1;
  });
  return {revenue:revenue,cogs:cogs,profit:revenue-cogs,unresolved:unresolved,orderCount:orderCount};
}

// ---------- combo detection by price ----------
// A combo's average selling price usually sits close to the sum of its
// components' own average selling prices (often a touch below, for the
// bundle discount). Search each un-grouped product's price against
// combinations of the others (quantities 0-2, up to 4 items total) and
// flag close matches as suggestions rather than applying them silently.
function findSubsetSum(candidates, target){
  var lower = target * 0.95;
  var upper = target * 1.35;
  var best = null;
  function qtyTotal(chosen){ return chosen.reduce(function(a,c){ return a + c.qty; }, 0); }
  function search(idx, sum, chosen){
    if(sum > upper + 0.01) return;
    var qc = qtyTotal(chosen);
    if(qc >= 2 && sum >= lower && sum <= upper){
      if(!best || qc < qtyTotal(best)) best = chosen.slice();
    }
    if(idx >= candidates.length || qc >= 4) return;
    for(var q=0; q<=2; q++){
      if(q>0) chosen.push({ component:candidates[idx].name, qty:q });
      search(idx+1, sum + q*candidates[idx].avgValue, chosen);
      if(q>0) chosen.pop();
    }
  }
  search(0, 0, []);
  return best;
}
function detectCombos(){
  var groups = buildMasterGroups(null);
  var priced = groups.map(function(g){
    return { name:g.name, avgValue: g.units > 0 ? g.grossValue/g.units : 0, isCombo: !!(state.combos[g.name] && state.combos[g.name].length) };
  }).filter(function(g){ return g.avgValue > 0; });

  var suggestions = [];
  priced.forEach(function(target){
    if(target.isCombo) return;
    var others = priced.filter(function(c){ return c.name !== target.name && !c.isCombo; });
    if(others.length > 14) return;
    var match = findSubsetSum(others, target.avgValue);
    if(match && match.length){
      var matchedSum = match.reduce(function(s,c){
        var comp = others.find(function(o){ return o.name === c.component; });
        return s + comp.avgValue * c.qty;
      }, 0);
      suggestions.push({ group:target.name, targetAvg:target.avgValue, matchedSum:matchedSum, components:match });
    }
  });
  return suggestions;
}

function groupProfit(g){
  var hasCost=(g.missingUnits||0)<=0.0001;
  var cogs=g.cogs||0;
  var trueProfit=(g.net||0)-cogs;
  var currentCost=getCostAtDate(g.name,null);
  return {hasCost:hasCost,cogs:cogs,trueProfit:trueProfit,cost:currentCost,missingUnits:g.missingUnits||0};
}

// ---------- per-platform profit slice (for that platform's dashboard) ----------
function computePlatformProfit(pf, range){
  var cogs=0, trueProfit=0, seen={}, missing={};
  var groups=buildMasterGroups(range, pf);
  groups.forEach(function(g){
    seen[g.name]=true;
    cogs += g.cogs||0;
    trueProfit += g.net-(g.cogs||0);
    if((g.missingUnits||0)>0.0001) missing[g.name]=true;
  });
  return { cogs:cogs, trueProfit:trueProfit, missingCount:Object.keys(missing).length, totalCount:Object.keys(seen).length };
}

function renderProductComboManager(groups){
  var names=groups.map(function(g){return g.name;});
  var html='<div style="padding:2px 0;">';
  html+='<p style="font-size:13px;font-weight:600;margin:0 0 5px;">Reusable product combos</p>';
  html+='<p class="note" style="margin:0 0 10px;">Use this only when a listing should always be treated as a bundle of products. For an unusual Amazon order, use <strong>Order P/L</strong> and define it by Order ID instead.</p>';

  html+='<div style="overflow:auto;"><table style="width:100%;font-size:12.5px;"><thead><tr><th>Product / listing</th><th>Current combo</th><th class="num">Cost</th><th></th></tr></thead><tbody>';
  names.forEach(function(n){
    var comps=state.combos[n]||[];
    var desc=comps.length?comps.map(function(c){return escAttr(c.component)+' × '+c.qty;}).join(' + '):'<span class="note">Not a combo</span>';
    var comboCost=comps.length?getEffectiveCost(n,null):getCostAtDate(n,null);
    html+='<tr><td class="name">'+escAttr(n)+'</td><td>'+desc+'</td><td class="num">'+(comboCost===null?'—':fmtINR(comboCost))+'</td><td class="num"><button type="button" class="link-btn combo-edit-btn" data-group="'+escAttr(n)+'" style="color:var(--teal);">'+(comps.length?'Edit combo':'Define combo')+'</button>'+(comps.length?' <button type="button" class="link-btn combo-delete-btn" data-group="'+escAttr(n)+'" style="color:var(--red,#a43b2f);">Clear</button>':'')+'</td></tr>';
    if(state.editingCombo===n) html+=comboEditorRowHtml(n,names);
  });
  html+='</tbody></table></div></div>';
  return html;
}

function renderLegacyDashboard(){
  var html = '';
  var range = computeRange();
  var periods = buildAvailablePeriods();

  html += filterToolbarHTML(periods);

  html += '<div class="section chart-card"><div class="row-between"><h2 style="margin:0;">Your products</h2>';
  html += '<span class="meta" style="font-family:\'IBM Plex Mono\',monospace;font-size:12px;color:var(--ink-soft);">' + rangeLabel(range) + ', all platforms, combined</span>';
  html += '</div><div id="masterTable"></div></div>';

  ['amazon','flipkart'].forEach(function(pf){
    var reports = state.history.filter(function(e){ return e.platform === pf; });
    if(!reports.length) return;
    html += platformSectionHTML(pf, reports);
  });

  html += '<datalist id="groupOptions"></datalist>';

  mainArea.innerHTML = html;

  mainArea.querySelectorAll('.filter-pill').forEach(function(el){
    el.addEventListener('click', function(){
      state.filter.mode = el.getAttribute('data-mode');
      renderAll();
    });
  });
  var monthSel = document.getElementById('filterMonth');
  if(monthSel) monthSel.addEventListener('change', function(){ state.filter.month = monthSel.value; renderAll(); });
  var yearSel = document.getElementById('filterYear');
  if(yearSel) yearSel.addEventListener('change', function(){ state.filter.year = yearSel.value; renderAll(); });
  var fromInput = document.getElementById('filterFrom');
  var toInput = document.getElementById('filterTo');
  if(fromInput) fromInput.addEventListener('change', function(){ state.filter.from = fromInput.value; renderAll(); });
  if(toInput) toInput.addEventListener('change', function(){ state.filter.to = toInput.value; renderAll(); });

  mainArea.querySelectorAll('.history-item').forEach(function(el){
    el.addEventListener('click', function(e){
      if(e.target.classList.contains('del')) return;
      var pf = el.getAttribute('data-pf');
      state.selected[pf] = el.getAttribute('data-key');
      renderAll();
    });
  });
  mainArea.querySelectorAll('.del').forEach(function(el){
    el.addEventListener('click', async function(e){
      e.stopPropagation();
      var key = el.getAttribute('data-delkey');
      var pf = el.getAttribute('data-pf');
      await deleteReport(key);
      delete state.cache[key];
      if(state.selected[pf] === key) state.selected[pf] = null;
      await refresh();
    });
  });

  renderMasterProducts();
  ['amazon','flipkart'].forEach(function(pf){
    if(state.selected[pf]) renderPlatformCharts(pf);
  });
}

function amazonTransactionBreakdownHTML(range){
  var reports = state.history.filter(function(e){return e.platform==='amazon' && reportOverlaps(e,range);});
  if(!reports.length) return '';
  var all={orderPayments:[],refunds:[],otherAmounts:[]};
  reports.forEach(function(e){
    var r=state.cache[e.key]; if(!r || !r.buckets) return;
    ['orderPayments','refunds','otherAmounts'].forEach(function(k){
      (r.buckets[k]||[]).forEach(function(x){
        if(!range || (x.date>=range.from && x.date<=range.to)) all[k].push(x);
      });
    });
  });
  function aggregate(rows, keyFn){
    var m={};
    rows.forEach(function(r){var k=keyFn(r)||'Other'; if(!m[k])m[k]={label:k,amount:0,rows:0};m[k].amount+=Number(r.amount)||0;m[k].rows++;});
    return Object.keys(m).map(function(k){return m[k];}).sort(function(a,b){return Math.abs(b.amount)-Math.abs(a.amount);});
  }
  function moneyTable(title, rows, empty){
    var byDesc=aggregate(rows,function(r){
      var a=r.amountType||'Other'; var d=r.description||''; return d ? a+' — '+d : a;
    });
    var html='<div style="border:1px solid var(--rule);border-radius:var(--radius);background:var(--paper-raised);overflow:hidden;">';
    html+='<div style="padding:12px 14px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center;gap:10px;"><strong style="font-size:13px;">'+title+'</strong><span class="meta">'+rows.length+' source rows</span></div>';
    if(!rows.length) return html+'<p class="note" style="padding:0 14px 12px;">'+empty+'</p></div>';
    html+='<div style="overflow:auto;max-height:320px;"><table><thead><tr><th>Amount type / description</th><th class="num">Rows</th><th class="num">Amount (INR)</th></tr></thead><tbody>';
    byDesc.forEach(function(x){html+='<tr><td class="name">'+escAttr(x.label)+'</td><td class="num">'+fmtNum(x.rows)+'</td><td class="num '+(x.amount<0?'neg-text':'')+'">'+fmtINR(x.amount)+'</td></tr>';});
    html+='</tbody></table></div></div>';
    return html;
  }
  var productAgg={};
  all.orderPayments.concat(all.refunds).forEach(function(r){
    if(!r.sku) return; var k=r.sku; if(!productAgg[k])productAgg[k]={sku:k,order:0,refund:0,units:0,refundUnits:0,items:{}};
    if(r.type==='Order') productAgg[k].order+=Number(r.amount)||0; else productAgg[k].refund+=Number(r.amount)||0;
    var item=(r.orderId||'')+'::'+(r.orderItemCode||r.sku);
    if(r.type==='Order' && !productAgg[k].items[item]){productAgg[k].items[item]=true;productAgg[k].units+=Number(r.quantity)||1;}
    if(r.type==='Refund' && !productAgg[k].items['R::'+item]){productAgg[k].items['R::'+item]=true;productAgg[k].refundUnits+=Number(r.quantity)||1;}
  });
  var prod=Object.keys(productAgg).map(function(k){return productAgg[k];}).sort(function(a,b){return Math.abs(b.order+b.refund)-Math.abs(a.order+a.refund);});
  var html='<div class="section chart-card"><div class="row-between"><h2 style="margin:0;font-size:15px;">Amazon transaction breakdown</h2><span class="meta">Parsed directly from the text flat file</span></div>';
  html+='<p class="note" style="margin:6px 0 12px;">The uploaded <strong>.txt/.tsv</strong> file is treated as a tab-separated settlement ledger. We do not treat each line as a sale and we do not need to convert the file before calculating. Financial rows are aggregated first, then product quantities are counted from unique order-item codes.</p>';
  html+='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;">';
  html+=moneyTable('Order payments',all.orderPayments,'No Order transactions in this range.');
  html+=moneyTable('Refunds',all.refunds,'No Refund transactions in this range.');
  html+=moneyTable('Other amounts',all.otherAmounts,'No other transaction types in this range.');
  html+='</div>';
  html+='<div style="margin-top:12px;border:1px solid var(--rule);border-radius:var(--radius);background:var(--paper-raised);overflow:hidden;">';
  html+='<div style="padding:12px 14px;border-bottom:1px solid var(--rule);"><strong style="font-size:13px;">Product-level transaction calculation</strong><div class="note" style="margin-top:3px;">Order and refund financial rows are aggregated by SKU. Units are counted once per unique order-item-code, not per financial row.</div></div>';
  html+='<div style="overflow:auto;max-height:360px;"><table><thead><tr><th>SKU</th><th class="num">Order units</th><th class="num">Order payments</th><th class="num">Refund units</th><th class="num">Refunds</th><th class="num">Product net</th></tr></thead><tbody>';
  prod.forEach(function(x){var net=x.order+x.refund;html+='<tr><td class="name">'+escAttr(x.sku)+'</td><td class="num">'+fmtNum(x.units)+'</td><td class="num">'+fmtINR(x.order)+'</td><td class="num">'+fmtNum(x.refundUnits)+'</td><td class="num neg-text">'+fmtINR(x.refund)+'</td><td class="num"><strong>'+fmtINR(net)+'</strong></td></tr>';});
  html+='</tbody></table></div></div></div>';
  return html;
}

function amazonKpiHTML(range){

  html += kpiCard('Net settled', t.net, t.net >= 0 ? 'pos' : 'neg');
  html += '</div>';
  html += '<p class="note">Amazon flat-file rows are grouped by <strong>transaction type</strong>: <strong>Order</strong> = all order-payment components (principal, tax, shipping, fees, TCS/TDS, promotions, etc.); <strong>Refund</strong> = all refund components; everything else is kept in <strong>Other amounts</strong>. Product units are counted once per unique order item, not once per financial row.</p>';

function flipkartKpiHTML(range){
  var t = totalsFor('flipkart', range);
  var returnsNeg = -t.returns;
  var html = '<div class="kpis">';
  html += kpiCard('Gross sales', t.grossSales, null);
  html += kpiCard('Returns & cancellations', returnsNeg, 'neg');
  html += kpiCard('Total expenses', -t.expenses, 'neg');
  html += kpiCard('Net earnings', t.net, t.net >= 0 ? 'pos' : 'neg');
  html += '</div>';
  html += '<p class="note">Returns & cancellations break down as RTO (logistics return) ' + fmtINR(t.rto) + ', customer returns (RVP) ' + fmtINR(t.rvp) + ', cancellations ' + fmtINR(t.cancelled) + '. Net earnings also includes ' + fmtINR(t.rewards + t.itc) + ' in rewards and input tax credits. Figures are taken directly from Flipkart\'s own Overall Summary, so they reconcile exactly to net earnings.</p>';

function totalsFor(pf, range){
  var totals = null;
  state.history.filter(function(e){ return e.platform===pf && reportOverlaps(e, range); }).forEach(function(e){
    var rep = state.cache[e.key];
    if(!rep) return;
    var part = filteredTotals(rep, range);
    if(!part) return;
    if(!totals){
      totals = JSON.parse(JSON.stringify(part));
      if(pf === 'amazon') totals.byType = Object.assign({}, part.byType || {});
    } else {
      Object.keys(part).forEach(function(k){
        if(k === 'byType') Object.keys(part.byType || {}).forEach(function(t){ totals.byType[t]=(totals.byType[t]||0)+part.byType[t]; });
        else totals[k]=(totals[k]||0)+(part[k]||0);
      });
    }
  });
  return totals || (pf === 'amazon'
    ? { orderRevenue:0, orderPayments:0, refunds:0, otherAmounts:0, reimbursements:0, fees:0, byType:{}, net:0, deferredCount:0, deferredTotal:0 }
    : { grossSales:0, returns:0, rto:0, rvp:0, cancelled:0, expenses:0, rewards:0, itc:0, net:0 });
}

function wirePLEditor(container){

    // change the current P/L.

    delete state.otherChargesCatalog[state.editingCost];

function wireComboEditor(container){
  var selects = container.querySelectorAll('.combo-component-select');
  var qtys = container.querySelectorAll('.combo-qty-input');
  var removes = container.querySelectorAll('.combo-remove-btn');
  var addRow = container.querySelector('.combo-add-row-btn');
  var save = container.querySelector('.combo-save-btn');
  var cancel = container.querySelector('.combo-cancel-btn');

  selects.forEach(function(el){
    el.addEventListener('change', function(){
      var idx = parseInt(el.getAttribute('data-idx'),10);
      state.comboDraft[idx].component = el.value;
      renderMasterProducts();
    });
  });
  qtys.forEach(function(el){
    el.addEventListener('change', function(){
      var idx = parseInt(el.getAttribute('data-idx'),10);
      state.comboDraft[idx].qty = Math.max(1, parseFloat(el.value) || 1);
      renderMasterProducts();
    });
  });
  removes.forEach(function(el){
    el.addEventListener('click', function(){
      var idx = parseInt(el.getAttribute('data-idx'),10);
      state.comboDraft.splice(idx,1);
      renderMasterProducts();
    });
  });
  if(addRow){
    addRow.addEventListener('click', function(){
      var g = state.editingCombo;
      var groups = buildMasterGroups(computeRange());
      var allNames = groups.map(function(x){ return x.name; });
      var options = allNames.filter(function(n){ return n !== g && !(state.combos[n] && state.combos[n].length); });
      var used = state.comboDraft.map(function(c){ return c.component; });
      var next = options.find(function(o){ return used.indexOf(o) === -1; }) || options[0];
      if(next) state.comboDraft.push({ component:next, qty:1 });
      renderMasterProducts();
    });
  }
  if(save){
    save.addEventListener('click', async function(){
      var g = state.editingCombo;
      var clean = (state.comboDraft||[]).filter(function(c){ return c.component; });
      if(clean.length){
        state.combos[g] = clean;
      } else {
        delete state.combos[g];
      }
      await saveCombos(state.combos);
      state.editingCombo = null;
      state.comboDraft = null;
      renderAll();
    });
  }
  if(cancel){
    cancel.addEventListener('click', function(){
      state.editingCombo = null;
      state.comboDraft = null;
      renderMasterProducts();
    });
  }
}

// ---------- per-platform charts + raw listing table ----------
var chartInstances = {};

function renderPlatformCharts(pf){
  renderTrendChart(pf);
  renderDailyChart(pf);
  renderRawListings(pf);
}

function renderTrendChart(pf){
  var canvasId = 'trendChart_' + pf;
  var ctx = document.getElementById(canvasId);
  if(!ctx) return;
  if(chartInstances[canvasId]){ chartInstances[canvasId].destroy(); }

  var pts = state.history.filter(function(e){ return e.platform===pf; })
    .sort(function(a,b){ return a.periodStart.localeCompare(b.periodStart); });
  var labels = pts.map(function(e){ return fmtLabel(e.periodStart); });
  var data = pts.map(function(e){ return e.net; });
  var color = pf === 'amazon' ? '#2A6FB5' : '#C08A19';

  chartInstances[canvasId] = new Chart(ctx, {
    type:'line',
    data: { labels: labels, datasets: [{ label: platLabel(pf), data:data, borderColor:color, backgroundColor:color, pointRadius:5, tension:0.15 }] },
    options: {
      responsive:true, maintainAspectRatio:false,
      scales: {
        x: { grid: { display:false } },
        y: { grid: { color:'#e6e4da' }, ticks: { callback: function(v){ return (v<0?'-':'') + '\u20B9' + (Math.abs(v)/1000).toFixed(0) + 'k'; } } }
      },
      plugins: { legend: { display:false } }
    }
  });
}

function renderDailyChart(pf){
  var canvasId = 'dailyChart_' + pf;
  var ctx = document.getElementById(canvasId);
  var rangeLabel = document.getElementById('selectedRangeLabel_' + pf);
  if(!ctx) return;
  if(chartInstances[canvasId]){ chartInstances[canvasId].destroy(); chartInstances[canvasId] = null; }
  var rep = state.selected[pf] ? state.cache[state.selected[pf]] : null;
  if(!rep || !rep.daily || !rep.daily.length) return;
  var range = computeRange();
  var days = filteredDaily(rep, range);
  if(!days.length) return;
  if(rangeLabel) rangeLabel.textContent = (days[0].date + ' \u2192 ' + days[days.length-1].date);

  var labels = days.map(function(d){ return fmtLabel(d.date); });
  var gross = days.map(function(d){ return Math.round(d.gross); });
  var net = days.map(function(d){ return Math.round(d.net); });
  var deductions = days.map(function(d,i){ return Math.min(0, Math.round((d.net || 0) - (d.gross || 0))); });

  chartInstances[canvasId] = new Chart(ctx, {
    data: {
      labels: labels,
      datasets: [
        { type:'bar', label:'Gross value', data:gross, backgroundColor:'#2A6FB5', borderRadius:4, stack:'s' },
        { type:'bar', label:'Deductions / returns', data:deductions, backgroundColor:'#A8422F', borderRadius:4, stack:'s' },
        { type:'line', label:'Net earnings', data:net, borderColor:'#1F6E56', backgroundColor:'#1F6E56', pointRadius:5, tension:0.15 }
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      scales: {
        x: { stacked:true, grid:{ display:false } },
        y: { stacked:true, grid:{ color:'#e6e4da' }, ticks:{ callback:function(v){ return (v<0?'-':'') + '\u20B9' + (Math.abs(v)/1000).toFixed(0) + 'k'; } } }
      },
      plugins: { legend: { display:false } }
    }
  });
}

function renderRawListings(pf){
  var container = document.getElementById('productTable_' + pf);
  if(!container) return;
  var rep = state.selected[pf] ? state.cache[state.selected[pf]] : null;
  if(!rep){
    container.innerHTML = '<p class="note">Select a report from history above to see its listings.</p>';
    return;
  }

  var rateBasis = rep.products.length && rep.products[0].rateBasis === 'units' ? 'by units returned' : 'by value refunded';
  var rows = rep.products.map(function(p){
    var rateStr = p.refundRate.toFixed(1) + '%';
    var rk = rawKey(pf, p.name);
    var groupVal = state.productGroups[rk] || '';
    var units = p.netUnits !== undefined ? p.netUnits : (p.grossUnits || 0);
    return '<tr><td class="name">' + p.name + '</td>' +
      '<td class="num"><input type="text" class="group-input" list="groupOptions" placeholder="' + p.name.replace(/"/g,'&quot;') + '" value="' + groupVal.replace(/"/g,'&quot;') + '" data-rawkey="' + rk + '"></td>' +
      '<td class="num">' + fmtNum(units) + '</td>' +
      '<td class="num">' + fmtINR(p.net) + '</td>' +
      '<td class="num"><span class="refund-tag ' + refundBadgeClass(p.refundRate) + '">' + rateStr + '</span></td></tr>';
  }).join('');

  container.innerHTML =
    '<table><thead><tr><th>Listing</th><th class="num">Group as</th><th class="num">Units sold</th><th class="num">Net earnings</th><th class="num">Refund rate</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table>' +
    '<p class="note">Refund rate is measured ' + rateBasis + '.</p>';

  var datalist = document.getElementById('groupOptions');
  if(datalist){
    var names = {};
    Object.keys(state.cache).forEach(function(k){
      var r = state.cache[k];
      if(!r) return;
      r.products.forEach(function(p){ names[groupNameFor(rawKey(r.platform, p.name), p.name)] = true; });
    });
    datalist.innerHTML = Object.keys(names).map(function(n){ return '<option value="' + n.replace(/"/g,'&quot;') + '">'; }).join('');
  }

  container.querySelectorAll('.group-input').forEach(function(el){
    el.addEventListener('change', async function(){
      var rk = el.getAttribute('data-rawkey');
      var val = el.value.trim();
      if(val === ''){
        delete state.productGroups[rk];
      } else {
        state.productGroups[rk] = val;
      }
      await saveGroups(state.productGroups);
      renderAll();
    });
  });
}
