  body+='<datalist id="groupOptions"></datalist>';
  mainArea.innerHTML=body;
  wireDashboardPage();
}

function amazonStructuredHTML(r){
  // Amazon P/L is intentionally calculated in three independent buckets:
  // 1) Order Payments, 2) Refunds, 3) Other. They are only combined in the
  // final Amazon P/L summary. Refunds never change Order Payment profit.
  if(!r) return '';
  function esc(v){return String(v===undefined||v===null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function money(v){return fmtINR(num(v));}
  function table(title,headers,rows,limit){
    var shown=rows.slice(0,limit||100);
    var h='<div class="section chart-card"><div class="row-between"><h2 style="margin:0;font-size:16px;">'+title+'</h2><span class="meta">'+rows.length+' rows</span></div>';
    if(!shown.length) return h+'<div class="empty" style="padding:1.5rem 0;">No records.</div></div>';
    h+='<div style="overflow:auto"><table><thead><tr>'+headers.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr></thead><tbody>';
    h+=shown.map(function(row){return '<tr>'+row.map(function(x){return '<td>'+esc(x)+'</td>';}).join('')+'</tr>';}).join('');
    h+='</tbody></table></div>';
    if(rows.length>shown.length) h+='<p class="note">Showing first '+shown.length+' rows. Download Excel for the complete structured data.</p>';
    return h+'</div>';
  }

  var orders=r.buckets&&r.buckets.orderPayments||[];
  var refunds=r.buckets&&r.buckets.refunds||[];
  var others=r.buckets&&r.buckets.otherAmounts||[];

  // Product-level order/refund aggregation. Order COGS is based on ORDER UNITS,
  // never net units. Refunds remain a separate financial bucket.
  var productMap={};
  orders.concat(refunds).forEach(function(x){
    var sku=x.sku||'(No SKU)';
    if(!productMap[sku]) productMap[sku]={sku:sku,orderAmount:0,refundAmount:0,orderUnits:0,refundUnits:0,orderItems:{},refundItems:{}};
    if(x.type==='Order'){
      productMap[sku].orderAmount += Number(x.amount)||0;
      var ok=(x.orderId||'NO-ORDER')+'::'+(x.orderItemCode||sku);
      if(!productMap[sku].orderItems[ok]){
        productMap[sku].orderItems[ok]=true;
        productMap[sku].orderUnits += Number(x.quantity)||1;
      }
    }else{
      productMap[sku].refundAmount += Number(x.amount)||0;
      var rk=(x.orderId||'NO-ORDER')+'::'+(x.orderItemCode||sku);
      if(!productMap[sku].refundItems[rk]){
        productMap[sku].refundItems[rk]=true;
        productMap[sku].refundUnits += Number(x.quantity)||1;
      }
    }
  });

  var productRows=Object.keys(productMap).map(function(k){
    var x=productMap[k];
    var g=groupNameFor(rawKey('amazon',x.sku),x.sku);
    var cost=getEffectiveCost(g,r.periodStart);
    var cogs=cost===null?null:cost*x.orderUnits;
    var orderProfit=cogs===null?null:x.orderAmount-cogs;
    return {sku:x.sku,group:g,orderUnits:x.orderUnits,orderAmount:x.orderAmount,refundUnits:x.refundUnits,refundAmount:x.refundAmount,cost:cost,cogs:cogs,orderProfit:orderProfit};
  }).sort(function(a,b){return b.orderAmount-a.orderAmount;});

  var orderProfit=productRows.reduce(function(a,x){return a+(x.orderProfit===null?0:x.orderProfit);},0);
  var orderCogs=productRows.reduce(function(a,x){return a+(x.cogs===null?0:x.cogs);},0);
  var missingCost=productRows.filter(function(x){return x.cogs===null && x.orderUnits>0;}).length;
  var refundImpact=r.totals.refunds||0;
  var otherImpact=r.totals.otherAmounts||0;
  var totalPL=orderProfit+refundImpact+otherImpact;

  var html='<div class="section">'+
    '<div class="row-between"><div><h2 style="margin:0;font-size:18px;">Amazon P/L calculation</h2>'+ 
    '<p class="note">The Amazon flat file is split into three independent calculations. <strong>Refunds are not included in Order Payments.</strong> Other settlement transactions are not forced into either bucket.</p></div>'+ 
    '<button id="amazonExportBtn" class="primary-btn" type="button">Download Excel</button></div></div>';

  // Three independent P/L cards.
  html+='<div class="section"><div class="kpis" style="grid-template-columns:repeat(3,1fr);">';
  html+=kpiCard('Order profit',orderProfit,orderProfit>=0?'pos':'neg');
  html+=kpiCard('Refund impact',refundImpact,refundImpact>=0?'pos':'neg');
  html+=kpiCard('Other impact',otherImpact,otherImpact>=0?'pos':'neg');
  html+='</div><div class="kpis" style="grid-template-columns:1fr;margin-top:10px;">'+kpiCard('Amazon total P/L',totalPL,totalPL>=0?'pos':'neg')+'</div></div>';

  // Financial reconciliation is deliberately separate from profit calculation.
  html+='<div class="section chart-card"><h2 style="font-size:16px;">Settlement reconciliation</h2>'+ 
    '<div style="overflow:auto"><table><tbody>'+ 
    '<tr><td>Declared settlement total</td><td class="num">'+money(r.settlementDeclaredTotal)+'</td></tr>'+ 
    '<tr><td>Order Payments — Order transactions only</td><td class="num">'+money(r.totals.orderPayments)+'</td></tr>'+ 
    '<tr><td>Refunds — Refund transactions only</td><td class="num neg-text">'+money(r.totals.refunds)+'</td></tr>'+ 
    '<tr><td>Other — all remaining transaction types</td><td class="num">'+money(r.totals.otherAmounts)+'</td></tr>'+ 
    '<tr><td><strong>Calculated net settlement</strong></td><td class="num"><strong>'+money(r.totals.net)+'</strong></td></tr>'+ 
    '<tr><td>Difference vs declared</td><td class="num">'+money(num(r.totals.net)-num(r.settlementDeclaredTotal))+'</td></tr>'+ 
    '</tbody></table></div></div>';

  // Bucket 1: Order Payments
  var orderRows=productRows.map(function(x){
    return [x.sku,x.group,x.orderUnits,money(x.orderAmount),x.cost===null?'':money(x.cost),x.cogs===null?'':money(x.cogs),x.orderProfit===null?'':money(x.orderProfit)];
  });
  html+='<div class="section chart-card"><div class="row-between"><div><h2 style="margin:0;font-size:16px;">① Order Payments → Order Profit</h2><p class="note">Only transaction-type <strong>Order</strong>. COGS uses the quantity of unique order items. Refunds are excluded.</p></div><span class="meta">'+money(r.totals.orderPayments)+' order payments</span></div>';
  html+='<div style="overflow:auto"><table><thead><tr><th>SKU</th><th>Group</th><th class="num">Order units</th><th class="num">Order payments</th><th class="num">Cost / unit</th><th class="num">COGS</th><th class="num">Order profit</th></tr></thead><tbody>';
  if(orderRows.length) html+=orderRows.map(function(row){return '<tr>'+row.map(function(x){return '<td class="'+(typeof x==='string'&&x.indexOf('₹')===0?'num':'')+'">'+esc(x)+'</td>';}).join('')+'</tr>';}).join('');
  else html+='<tr><td colspan="7" class="empty">No Order transactions.</td></tr>';
  html+='</tbody></table></div>';
  if(missingCost) html+='<p class="note" style="color:var(--gold);">'+missingCost+' SKU(s) need a cost price. Their Order Profit is left blank until a cost is entered in Manage.</p>';
  html+='</div>';

  // Bucket 2: Refunds. No COGS is silently assumed here.
  var refundBySku={};
  refunds.forEach(function(x){var sku=x.sku||'(No SKU)';if(!refundBySku[sku])refundBySku[sku]={sku:sku,amount:0,units:0,items:{}};refundBySku[sku].amount+=Number(x.amount)||0;var k=(x.orderId||'NO-ORDER')+'::'+(x.orderItemCode||sku);if(!refundBySku[sku].items[k]){refundBySku[sku].items[k]=true;refundBySku[sku].units+=Number(x.quantity)||1;}});
  var refundRows=Object.keys(refundBySku).map(function(k){var x=refundBySku[k];return [x.sku,x.units,money(x.amount)];}).sort(function(a,b){return Number(b[2].replace(/[^0-9.-]/g,''))-Number(a[2].replace(/[^0-9.-]/g,''));});
  html+='<div class="section chart-card"><div class="row-between"><div><h2 style="margin:0;font-size:16px;">② Refunds → Refund Impact</h2><p class="note">Only transaction-type <strong>Refund</strong>. This is kept separate from Order Profit. No refund COGS assumption is made here.</p></div><span class="meta">'+money(refundImpact)+' refund impact</span></div>';
  html+='<div style="overflow:auto"><table><thead><tr><th>SKU</th><th class="num">Refund units</th><th class="num">Refund amount</th></tr></thead><tbody>';
  if(refundRows.length) html+=refundRows.map(function(row){return '<tr><td class="name">'+esc(row[0])+'</td><td class="num">'+esc(row[1])+'</td><td class="num neg-text">'+esc(row[2])+'</td></tr>';}).join('');
  else html+='<tr><td colspan="3" class="empty">No Refund transactions.</td></tr>';
  html+='</tbody></table></div></div>';

  // Bucket 3: Other. It is deliberately not allocated to products.
  var otherRows=others.map(function(x){return [x.date,x.type,x.orderId||'',x.sku||'',x.amountType,x.description,money(x.amount)];});
  html+='<div class="section chart-card"><div class="row-between"><div><h2 style="margin:0;font-size:16px;">③ Other → Other Impact</h2><p class="note">Everything that is neither Order nor Refund. These amounts stay outside product Order Profit and Refund Impact.</p></div><span class="meta">'+money(otherImpact)+' other impact</span></div>';
  html+=table('', ['Date','Transaction Type','Order ID','SKU','Amount Type','Description','Amount'],otherRows,100);
  html+='</div>';

  // Final P/L bridge.
  html+='<div class="section chart-card"><h2 style="font-size:16px;">④ Amazon P/L Summary</h2><div style="overflow:auto"><table><tbody>'+ 
    '<tr><td>Order Profit</td><td class="num">'+money(orderProfit)+'</td></tr>'+ 
    '<tr><td>Refund Impact</td><td class="num">'+money(refundImpact)+'</td></tr>'+ 
    '<tr><td>Other Impact</td><td class="num">'+money(otherImpact)+'</td></tr>'+ 
    '<tr><td><strong>Amazon Total P/L</strong></td><td class="num"><strong>'+money(totalPL)+'</strong></td></tr>'+ 
    '</tbody></table></div><p class="note">Formula: <strong>Order Profit + Refund Impact + Other Impact = Amazon Total P/L</strong>. Settlement reconciliation remains a separate check against Amazon declared settlement amount.</p></div>';

  // Raw structured tables remain available below the P/L calculation.
  var ordersSummary=(r.orders||[]).map(function(o){return [o.date,o.id,(o.products||[]).map(function(p){return p.name+' × '+p.qty;}).join(' | '),o.rowCount,money(o.net)];});
  var orderPayments=(orders||[]).map(function(x){return [x.date,x.orderId,x.sku,x.orderItemCode,x.amountType,x.description,money(x.amount),x.quantity||''];});
  var refundRaw=(refunds||[]).map(function(x){return [x.date,x.orderId,x.sku,x.orderItemCode,x.amountType,x.description,money(x.amount),x.quantity||''];});
  html+='<div class="section"><h2 style="font-size:15px;">Structured source data</h2><p class="note">These are the Excel-style normalized tables generated from the uploaded flat file.</p></div>';
  html+=table('Order Summary',['Date','Order ID','Products / quantities','Financial rows','Order payments'],ordersSummary,100);
  html+=table('Order Payments — raw financial rows',['Date','Order ID','SKU','Order Item Code','Amount Type','Description','Amount','Quantity'],orderPayments,50);
  html+=table('Refunds — raw financial rows',['Date','Order ID','SKU','Order Item Code','Amount Type','Description','Amount','Quantity'],refundRaw,50);
  return html;
}


function amazonStructuredHTMLTabs(r){
  if(!r) return '';
  function esc(v){return String(v===undefined||v===null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function money(v){return fmtINR(num(v));}
  var orders=(r.buckets&&r.buckets.orderPayments)||[];
  var refunds=(r.buckets&&r.buckets.refunds)||[];
  var others=(r.buckets&&r.buckets.otherAmounts)||[];

  // ORDER PAYMENTS: aggregate all financial rows by SKU/order-item and count quantity once.
  var om={};
  orders.forEach(function(x){
    var sku=x.sku||'(No SKU)';
    if(!om[sku]) om[sku]={sku:sku,amount:0,units:0,items:{}};
    om[sku].amount += Number(x.amount)||0;
    var key=(x.orderId||'NO-ORDER')+'::'+(x.orderItemCode||sku);
    if(!om[sku].items[key]){om[sku].items[key]=true;om[sku].units += Number(x.quantity)||1;}
  });
  var orderRows=Object.keys(om).map(function(k){
    var x=om[k], g=groupNameFor(rawKey('amazon',x.sku),x.sku), cost=getEffectiveCost(g,r.periodStart);
    var cogs=cost===null?null:cost*x.units, profit=cogs===null?null:x.amount-cogs;
    return {sku:x.sku,group:g,units:x.units,payment:x.amount,cost:cost,cogs:cogs,profit:profit};
  }).sort(function(a,b){return b.payment-a.payment;});
  var orderProfit=orderRows.reduce(function(a,x){return a+(x.profit===null?0:x.profit);},0);
  var orderCogs=orderRows.reduce(function(a,x){return a+(x.cogs===null?0:x.cogs);},0);
  var missing=orderRows.filter(function(x){return x.cost===null&&x.units>0;}).length;

  // REFUNDS: independently aggregate refund financial rows by SKU. No refund COGS is applied.
  var rm={};
  refunds.forEach(function(x){
    var sku=x.sku||'(No SKU)';
    if(!rm[sku]) rm[sku]={sku:sku,amount:0,units:0,items:{}};
    rm[sku].amount += Number(x.amount)||0;
    var key=(x.orderId||'NO-ORDER')+'::'+(x.orderItemCode||sku);
    if(!rm[sku].items[key]){rm[sku].items[key]=true;rm[sku].units += Number(x.quantity)||1;}
  });
  var refundRows=Object.keys(rm).map(function(k){var x=rm[k];return {sku:x.sku,units:x.units,amount:x.amount};}).sort(function(a,b){return a.amount-b.amount;});
  var refundImpact=r.totals.refunds||0;
  var otherImpact=r.totals.otherAmounts||0;
  var totalPL=orderProfit+refundImpact+otherImpact;

  var html='';
  html+='<div class="section"><div class="row-between"><div><h2 style="margin:0;font-size:18px;">Amazon P/L</h2><p class="note">Order Payments, Refunds, and Other are calculated independently. Refunds are never included in Order Payment profit.</p></div><button id="amazonExportBtn" class="primary-btn" type="button">Download Excel</button></div></div>';

  // High-level settlement bridge stays separate from the P/L tabs.
  html+='<div class="section chart-card"><h2 style="font-size:15px;">Settlement reconciliation</h2><div style="overflow:auto"><table><tbody>';
  html+='<tr><td>Declared settlement total</td><td class="num">'+money(r.settlementDeclaredTotal)+'</td></tr>';
  html+='<tr><td>Order Payments</td><td class="num">'+money(r.totals.orderPayments)+'</td></tr>';
  html+='<tr><td>Refunds</td><td class="num">'+money(r.totals.refunds)+'</td></tr>';
  html+='<tr><td>Other</td><td class="num">'+money(r.totals.otherAmounts)+'</td></tr>';
  html+='<tr><td><strong>Net settlement</strong></td><td class="num"><strong>'+money(r.totals.net)+'</strong></td></tr>';
  html+='<tr><td>Difference vs declared</td><td class="num">'+money(num(r.totals.net)-num(r.settlementDeclaredTotal))+'</td></tr>';
  html+='</tbody></table></div></div>';

  // Real tabs: only one calculation area is visible at a time.
  html+='<div class="section" style="padding:0;overflow:hidden;">';
  html+='<div id="amazonPLTabs" style="display:flex;border-bottom:1px solid var(--rule);background:var(--paper-raised);overflow:auto;">';
  html+='<button type="button" class="amazon-tab active" data-tab="orders">Order Payments <span>'+money(r.totals.orderPayments)+'</span></button>';
  html+='<button type="button" class="amazon-tab" data-tab="refunds">Refunds <span>'+money(refundImpact)+'</span></button>';
  html+='<button type="button" class="amazon-tab" data-tab="other">Other <span>'+money(otherImpact)+'</span></button>';
  html+='<button type="button" class="amazon-tab" data-tab="summary">P/L Summary</button>';
  html+='</div>';
  html+='<div id="amazonTabContent" style="padding:14px;"></div></div>';

  // Keep complete normalized source tables below the tabs, not mixed into P/L.
  html+='<div class="section chart-card"><h2 style="font-size:15px;">Structured source data</h2><p class="note">The flat file is normalized into Excel-style tables. These are source-data tables, separate from the P/L tabs.</p></div>';
  function table(title,headers,rows,limit){
    var shown=rows.slice(0,limit||100), h='<div class="section chart-card"><div class="row-between"><h2 style="margin:0;font-size:15px;">'+esc(title)+'</h2><span class="meta">'+rows.length+' rows</span></div>';
    if(!shown.length)return h+'<div class="empty" style="padding:1.2rem 0;">No records.</div></div>';

  html+=table('Order Payments — financial rows',['Date','Order ID','SKU','Order Item Code','Amount Type','Description','Amount','Quantity'],orderSource,50);
  html+=table('Refunds — financial rows',['Date','Order ID','SKU','Order Item Code','Amount Type','Description','Amount','Quantity'],refundSource,50);
  html+=table('Other — financial rows',['Date','Transaction Type','Order ID','SKU','Amount Type','Description','Amount'],otherSource,100);

  // Attach data for the tab renderer through a closure-free HTML data payload.

  setTimeout(function(){
    var root=document.getElementById('amazonPLTabs'), content=document.getElementById('amazonTabContent');
    if(!root||!content)return;
    function renderTab(tab){
      var h='';
      if(tab==='orders'){
        h+='<div class="row-between"><div><h2 style="margin:0;font-size:16px;">Order Payments → Order Profit</h2><p class="note">Only transaction-type <strong>Order</strong>. Refunds are completely excluded.</p></div><strong>'+money(orderProfit)+'</strong></div>';
        h+='<div class="kpis" style="grid-template-columns:repeat(3,1fr);margin:12px 0;"><div class="kpi"><div class="kpi-label">Order payments</div><div class="kpi-value">'+money(r.totals.orderPayments)+'</div></div><div class="kpi"><div class="kpi-label">COGS</div><div class="kpi-value neg-text">'+money(-orderCogs)+'</div></div><div class="kpi"><div class="kpi-label">Order profit</div><div class="kpi-value '+(orderProfit>=0?'pos-text':'neg-text')+'">'+money(orderProfit)+'</div></div></div>';
        h+='<div style="overflow:auto"><table><thead><tr><th>SKU</th><th>Group</th><th class="num">Units</th><th class="num">Order payments</th><th class="num">Cost / unit</th><th class="num">COGS</th><th class="num">Order profit</th></tr></thead><tbody>';
        if(orderRows.length)h+=orderRows.map(function(x){return '<tr><td class="name">'+esc(x.sku)+'</td><td>'+esc(x.group)+'</td><td class="num">'+x.units+'</td><td class="num">'+money(x.payment)+'</td><td class="num">'+(x.cost===null?'—':money(x.cost))+'</td><td class="num">'+(x.cogs===null?'—':money(-x.cogs))+'</td><td class="num '+(x.profit!==null&&x.profit<0?'neg-text':'pos-text')+'">'+(x.profit===null?'set cost':money(x.profit))+'</td></tr>';}).join('');

        h+='</tbody></table></div>';
        if(missing)h+='<p class="note" style="color:var(--gold);">'+missing+' SKU(s) need a cost in Manage. Their Order Profit is not included until a cost is available.</p>';
      }else if(tab==='refunds'){
        h+='<div class="row-between"><div><h2 style="margin:0;font-size:16px;">Refunds → Refund Impact</h2><p class="note">Only transaction-type <strong>Refund</strong>. This tab is independent of Order Profit.</p></div><strong class="neg-text">'+money(refundImpact)+'</strong></div>';

        else h+='<tr><td colspan="3" class="empty">No Refund transactions.</td></tr>';

      }else if(tab==='other'){
        h+='<div class="row-between"><div><h2 style="margin:0;font-size:16px;">Other → Other Impact</h2><p class="note">All transaction types other than Order and Refund. These are not allocated to products.</p></div><strong>'+money(otherImpact)+'</strong></div>';
        h+='<div class="kpis" style="grid-template-columns:1fr;margin:12px 0;"><div class="kpi"><div class="kpi-label">Other impact</div><div class="kpi-value '+(otherImpact>=0?'pos-text':'neg-text')+'">'+money(otherImpact)+'</div></div></div>';
        h+='<div style="overflow:auto"><table><thead><tr><th>Date</th><th>Transaction Type</th><th>Order ID</th><th>SKU</th><th>Amount Type</th><th>Description</th><th class="num">Amount</th></tr></thead><tbody>';
        if(others.length)h+=others.slice(0,100).map(function(x){return '<tr><td>'+esc(x.date)+'</td><td>'+esc(x.type)+'</td><td>'+esc(x.orderId||'')+'</td><td>'+esc(x.sku||'')+'</td><td>'+esc(x.amountType)+'</td><td>'+esc(x.description)+'</td><td class="num">'+money(x.amount)+'</td></tr>';}).join('');
        else h+='<tr><td colspan="7" class="empty">No Other transactions.</td></tr>';
        h+='</tbody></table></div>';
      }else{
        h+='<h2 style="margin:0 0 10px;font-size:16px;">Amazon P/L Summary</h2><div class="kpis" style="grid-template-columns:repeat(4,1fr);">';
        h+=kpiCard('Order profit',orderProfit,orderProfit>=0?'pos':'neg');
        h+=kpiCard('Refund impact',refundImpact,refundImpact>=0?'pos':'neg');
        h+=kpiCard('Other impact',otherImpact,otherImpact>=0?'pos':'neg');
        h+=kpiCard('Amazon total P/L',totalPL,totalPL>=0?'pos':'neg');
        h+='</div><div style="overflow:auto;margin-top:14px"><table><tbody><tr><td>Order Profit</td><td class="num">'+money(orderProfit)+'</td></tr><tr><td>Refund Impact</td><td class="num">'+money(refundImpact)+'</td></tr><tr><td>Other Impact</td><td class="num">'+money(otherImpact)+'</td></tr><tr><td><strong>Amazon Total P/L</strong></td><td class="num"><strong>'+money(totalPL)+'</strong></td></tr></tbody></table></div><p class="note">Formula: Order Profit + Refund Impact + Other Impact = Amazon Total P/L.</p>';
      }
      content.innerHTML=h;
      root.querySelectorAll('.amazon-tab').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-tab')===tab);b.onclick=function(){renderTab(b.getAttribute('data-tab'));};});
    }
    renderTab('orders');
  },0);
  return html;
}


function flipkartStructuredHTML(r){
  if(!r) return '';
  function esc(v){return String(v===undefined||v===null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function money(v){return fmtINR(num(v));}

  // Flipkart SKU-level P&L is the authoritative source for the Order Details /
  // Payments dashboard. Do not rebuild the SKU table from order-level rows,
  // otherwise all rows can collapse into "(No SKU)" when the Orders P&L sheet
  // does not expose SKU consistently.
  var skuProducts=(r.products||[]).map(function(p){
    return {
      sku:p.name||'(No SKU)',
      grossUnits:num(p.grossUnits),
      netUnits:num(p.netUnits),
      returnedUnits:num(p.returnedUnits),
      payment:num(p.grossValue),
      netEarnings:num(p.net),
      refundValue:p.refundValue===null?null:num(p.refundValue)
    };
  });
  skuProducts.sort(function(a,b){return b.payment-a.payment;});

  var returns=r.refundCancellationRows||[], other=r.otherCharges||[];
  var costMap=state.costCatalog||{};
  var orderPaymentTotal=skuProducts.reduce(function(a,x){return a+x.payment;},0);
  var grossUnitsTotal=skuProducts.reduce(function(a,x){return a+x.grossUnits;},0);
  var returnedUnitsTotal=skuProducts.reduce(function(a,x){return a+x.returnedUnits;},0);

  skuProducts.forEach(function(x){
    var cost=costMap[groupNameFor(rawKey('flipkart',x.sku),x.sku)];
    x.cost=cost===undefined?null:num(cost);
    // Order Profit is based on the order-payment side only. Refunds and
    // cancellations are handled by their own dashboard.
    x.cogs=x.cost===null?0:x.cost*x.grossUnits;
    x.profit=x.cost===null?null:x.payment-x.cogs;
  });

  var totalCogs=skuProducts.reduce(function(a,x){return a+(x.cost===null?0:x.cogs);},0);
  var orderProfit=skuProducts.reduce(function(a,x){return a+(x.profit===null?0:x.profit);},0);
  var missing=skuProducts.filter(function(x){return x.profit===null;}).length;
  var refundTotal=returns.reduce(function(a,x){return a+num(x.netEarnings||x.orderItemValue);},0);
  var otherTotal=other.reduce(function(a,x){return a+num(x.amount);},0);

  var html='<div class="section chart-card"><div class="row-between"><div><h2 style="margin:0;font-size:18px;">Flipkart financial dashboards</h2><p class="note">Order payments are calculated SKU-wise from the Flipkart SKU-level P&amp;L sheet. Refunds/cancellations and other settlement charges remain separate.</p></div></div>';
  html+='<div class="tabs" style="margin-top:14px;">';
  [['orders','Order Details / Payments'],['refunds','Refunds & Cancellations'],['other','Other Charges / Reimbursements'],['summary','P/L Summary']].forEach(function(t){html+='<div class="tab flipkart-tab '+(t[0]==='orders'?'active':'')+'" data-tab="'+t[0]+'">'+t[1]+'</div>';});
  html+='</div><div id="flipkartStructuredContent" style="margin-top:14px;"></div></div>';
  setTimeout(function(){
    var root=document.querySelector('#flipkartStructuredContent'); if(!root)return;
    function renderTab(tab){
      var h='';
      if(tab==='orders'){
        h+='<div class="row-between"><div><h2 style="margin:0;font-size:16px;">Order Details / Payments — SKU wise</h2><p class="note">Source: Flipkart <b>SKU-level P&amp;L</b>. Refunds and cancellations are excluded from Order Profit.</p></div><strong class="pos-text">'+money(orderPaymentTotal)+'</strong></div>';
        h+='<div class="kpis" style="grid-template-columns:repeat(3,1fr);margin:12px 0;">';
        h+='<div class="kpi"><div class="kpi-label">Order payments</div><div class="kpi-value pos-text">'+money(orderPaymentTotal)+'</div></div>';
        h+='<div class="kpi"><div class="kpi-label">COGS</div><div class="kpi-value neg-text">'+money(-totalCogs)+'</div></div>';
        h+='<div class="kpi"><div class="kpi-label">Order profit</div><div class="kpi-value '+(orderProfit>=0?'pos-text':'neg-text')+'">'+money(orderProfit)+'</div></div></div>';
        h+='<div style="overflow:auto"><table><thead><tr><th>SKU ID</th><th class="num">Gross Units</th><th class="num">Net Units</th><th class="num">Returned &amp; Cancelled</th><th class="num">Order Payments</th><th class="num">Cost / Unit</th><th class="num">COGS</th><th class="num">Order Profit</th></tr></thead><tbody>';
        if(skuProducts.length){
          skuProducts.forEach(function(x){
            h+='<tr><td class="name">'+esc(x.sku)+'</td><td class="num">'+fmtNum(x.grossUnits)+'</td><td class="num">'+fmtNum(x.netUnits)+'</td><td class="num">'+fmtNum(x.returnedUnits)+'</td><td class="num">'+money(x.payment)+'</td><td class="num">'+(x.cost===null?'—':money(x.cost))+'</td><td class="num">'+(x.cost===null?'—':money(x.cogs))+'</td><td class="num '+(x.profit===null?'':(x.profit>=0?'pos-text':'neg-text'))+'">'+(x.profit===null?'Set cost':money(x.profit))+'</td></tr>';
          });
        } else h+='<tr><td colspan="8" class="empty">No SKU-level order details found.</td></tr>';
        h+='</tbody></table></div>';
        if(missing) h+='<p class="note" style="color:var(--gold);">'+missing+' SKU(s) need a cost in Manage before their Order Profit can be calculated.</p>';
        h+='<p class="note">SKU quantities come from the Flipkart SKU-level P&amp;L sheet. Refunds/cancellations are not deducted from this Order Profit calculation.</p>';
      }else if(tab==='refunds'){
        h+='<div class="row-between"><div><h2 style="margin:0;font-size:16px;">Refunds &amp; Cancellations</h2><p class="note">Returns, RTO, RVP and cancellations are kept completely separate from Order Profit.</p></div><strong class="neg-text">'+money(refundTotal)+'</strong></div>';
        h+='<div style="overflow:auto;margin-top:12px"><table><thead><tr><th>Date</th><th>Order ID</th><th>SKU</th><th>Status</th><th class="num">Returned Units</th><th class="num">Order Value</th><th class="num">Net Earnings</th></tr></thead><tbody>';
        if(returns.length) returns.slice(0,300).forEach(function(x){h+='<tr><td>'+esc(x.date)+'</td><td>'+esc(x.orderId)+'</td><td class="name">'+esc(x.sku)+'</td><td>'+esc(x.status)+'</td><td class="num">'+fmtNum(x.returnedUnits)+'</td><td class="num">'+money(x.orderItemValue)+'</td><td class="num neg-text">'+money(x.netEarnings)+'</td></tr>';});
        else h+='<tr><td colspan="7" class="empty">No refunds or cancellations found.</td></tr>';
        h+='</tbody></table></div>';
      }else if(tab==='other'){
        h+='<div class="row-between"><div><h2 style="margin:0;font-size:16px;">Other Charges / Reimbursements</h2><p class="note">Expenses, rewards, input tax credits and other settlement adjustments are shown separately.</p></div><strong class="'+(otherTotal>=0?'pos-text':'neg-text')+'">'+money(otherTotal)+'</strong></div>';
        h+='<div style="overflow:auto;margin-top:12px"><table><thead><tr><th>Type</th><th>Description</th><th class="num">Amount</th></tr></thead><tbody>';
        if(other.length) other.forEach(function(x){h+='<tr><td>'+esc(x.type)+'</td><td>'+esc(x.description)+'</td><td class="num '+(x.amount<0?'neg-text':'pos-text')+'">'+money(x.amount)+'</td></tr>';});
        else h+='<tr><td colspan="3" class="empty">No other charges or reimbursements found.</td></tr>';
        h+='</tbody></table></div>';
      }else{
        h+='<h2 style="margin:0 0 12px;font-size:16px;">Flipkart P/L Summary</h2><div class="kpis" style="grid-template-columns:repeat(4,1fr);">';
        h+=kpiCard('Order profit',orderProfit,orderProfit>=0?'pos':'neg');
        h+=kpiCard('Refunds / cancellations',refundTotal,refundTotal>=0?'pos':'neg');
        h+=kpiCard('Other charges',otherTotal,otherTotal>=0?'pos':'neg');
        h+=kpiCard('Settlement / earnings',r.totals.net,r.totals.net>=0?'pos':'neg');
        h+='</div><p class="note" style="margin-top:12px;">Order Profit is based only on SKU-level order payments and COGS. Refunds/cancellations and other charges are shown independently.</p>';
      }
      root.innerHTML=h;
      root.parentElement.querySelectorAll('.flipkart-tab').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-tab')===tab);b.onclick=function(){renderTab(b.getAttribute('data-tab'));};});
    }
    renderTab('orders');
  },0);
  return html;
}

function renderAll(){
  // Each page is rendered independently. A failure on the dashboard must never
  // prevent Amazon/Flipkart upload controls from appearing.
  try{
    if(state.page==='dashboard'){
      renderDashboardPage();
    }else if(state.page==='amazon'){
      mainArea.innerHTML=pageUploadHTML('amazon')+selectedReportHTML('amazon');
      var ar=state.selected.amazon?state.cache[state.selected.amazon]:null;
      if(ar) mainArea.insertAdjacentHTML('beforeend',amazonStructuredHTMLTabs(ar));
    }else if(state.page==='flipkart'){
      mainArea.innerHTML=pageUploadHTML('flipkart')+selectedReportHTML('flipkart');
      var fr=state.selected.flipkart?state.cache[state.selected.flipkart]:null;
      if(fr){
        mainArea.insertAdjacentHTML('beforeend',flipkartStructuredHTML(fr));
      }
    }else{
      mainArea.innerHTML=manageHTML();
    }
  }catch(err){
    // Keep the selected page usable even if an optional analytics component fails.
    if(state.page==='amazon' || state.page==='flipkart'){
      mainArea.innerHTML=pageUploadHTML(state.page)+'<div class="section"><div class="note" style="color:var(--clay);">The upload area is ready. '+escAttr(err.message||'An optional dashboard component failed.')+'</div></div>';
    }else{
      mainArea.innerHTML='<div class="section"><div class="note" style="color:var(--clay);">Could not render this page: '+escAttr(err.message||'Unknown error')+'</div></div>';
    }
  }
  updateNav();
  wirePage();
  if(state.page==='flipkart' && state.selected.flipkart){try{renderPlatformCharts('flipkart');}catch(e){}}
}

function updateNav(){
  document.querySelectorAll('#appNav .nav-item').forEach(function(b){
    b.classList.toggle('active',b.getAttribute('data-page')===state.page);
  });
}

function wirePage(){
  // Bind the four permanent navigation buttons.
  document.querySelectorAll('#appNav .nav-item').forEach(function(b){
    b.onclick=function(e){e.preventDefault();setPage(b.getAttribute('data-page'));};
  });

  var dz=document.getElementById('pageDropzone'),fi=document.getElementById('pageFileInput');
  if(dz&&fi){
    dz.onclick=function(){fi.click();};
    dz.ondragover=function(e){e.preventDefault();dz.classList.add('drag');};
    dz.ondragleave=function(){dz.classList.remove('drag');};
    dz.ondrop=function(e){e.preventDefault();dz.classList.remove('drag');if(e.dataTransfer.files.length)handlePageFile(e.dataTransfer.files[0],dz.getAttribute('data-platform'));};
    fi.onchange=function(e){if(e.target.files.length)handlePageFile(e.target.files[0],dz.getAttribute('data-platform'));};
  }

  var existingBtn=document.getElementById('existingReportsBtn');
  if(existingBtn) existingBtn.onclick=function(){state.showExistingReports[state.page]=!state.showExistingReports[state.page];renderAll();};
  var rs=document.getElementById('pageReportSelect');
  if(rs) rs.onchange=function(){state.selected[state.page]=rs.value;renderAll();};
  mainArea.querySelectorAll('.history-item').forEach(function(el){
    el.onclick=function(e){
      if(e.target.classList.contains('del')) return;
      state.selected[el.getAttribute('data-pf')]=el.getAttribute('data-key');
      renderAll();
    };
  });
  mainArea.querySelectorAll('.del').forEach(function(el){
    el.onclick=async function(e){
      e.stopPropagation();
      var key=el.getAttribute('data-delkey'), pf=el.getAttribute('data-pf');
      await deleteReport(key); delete state.cache[key];
      if(state.selected[pf]===key) state.selected[pf]=null;
      await refresh();
    };
  });
  var ex=document.getElementById('amazonExportBtn');
  if(ex) ex.onclick=function(){exportAmazonWorkbook();};

  mainArea.querySelectorAll('.manage-save').forEach(function(b){
    b.onclick=async function(){
      var n=b.getAttribute('data-name');
      var inp=mainArea.querySelector('.manage-cost[data-name="'+n.replace(/"/g,'\\"')+'"]');
      var v=parseFloat(inp&&inp.value);
      if(!isFinite(v)||v<0){alert('Enter a valid non-negative cost.');return;}
      state.costCatalog[n]=v;
      await saveCostCatalog(state.costCatalog);
      renderAll();
    };
  });
}

async function handlePageFile(file,platform){
  var status=document.getElementById('pageDropStatus');
  if(status) status.textContent='Reading '+file.name+' …';
  var name=file.name.toLowerCase();
  try{
    var report;
    if(platform==='amazon'){
      if(!(name.endsWith('.txt')||name.endsWith('.tsv')||name.endsWith('.csv')))throw new Error('Amazon expects a .txt/.tsv flat settlement file.');
      var text=await file.text();
      report=parseAmazonCSV(text);
      report.rawText=text;report.sourceFileName=file.name;
      await dbSet(RAW_AMAZON_KEY,text);
    }else{
      if(!(name.endsWith('.xlsx')||name.endsWith('.xls')))throw new Error('Flipkart expects the XLSX P&L report.');
      var buf=await file.arrayBuffer();
      report=parseFlipkartXLSX(buf);report.sourceFileName=file.name;
    }
    var key=await saveReport(report);
    state.cache[key]=report;state.selected[platform]=key;
    await refresh();
  }catch(err){
    if(status) status.textContent='Could not read file: '+err.message;
  }
}

function exportAmazonWorkbook(){
  var r=state.selected.amazon?state.cache[state.selected.amazon]:null;if(!r)return;
  var wb=XLSX.utils.book_new();
  function add(name,rows){var ws=XLSX.utils.json_to_sheet(rows);XLSX.utils.book_append_sheet(wb,ws,name);}
  add('Order Payments',(r.buckets.orderPayments||[]).map(function(x){return {Date:x.date,'Order ID':x.orderId,SKU:x.sku,'Order Item Code':x.orderItemCode,'Amount Type':x.amountType,Description:x.description,Amount:x.amount,Quantity:x.quantity};}));
  add('Order Summary',(r.orders||[]).map(function(o){return {Date:o.date,'Order ID':o.id,'Items':(o.products||[]).map(function(p){return p.name+' × '+p.qty;}).join(' | '),'Rows':o.rowCount,'Net Settlement':o.net};}));
  add('Refunds',(r.buckets.refunds||[]).map(function(x){return {Date:x.date,'Order ID':x.orderId,SKU:x.sku,'Order Item Code':x.orderItemCode,'Amount Type':x.amountType,Description:x.description,Amount:x.amount,Quantity:x.quantity};}));
  add('Other Amounts',(r.buckets.otherAmounts||[]).map(function(x){return {Date:x.date,'Transaction Type':x.type,'Amount Type':x.amountType,Description:x.description,Amount:x.amount};}));
  add('Product Summary',(r.products||[]).map(function(p){var g=groupNameFor(rawKey('amazon',p.name),p.name),c=getEffectiveCost(g,r.periodStart),cogs=c===null?null:c*(p.netUnits||0);return {SKU:p.name,Group:g,'Order Units':p.grossUnits||0,'Refund Units':p.refundUnits||0,'Net Units':p.netUnits||0,'Order Payments':p.grossValue||0,'Refunds':-(p.refundValue||0),'Product Net':p.net,'Cost per Unit':c===null?'':c,'COGS':cogs===null?'':cogs,'True Profit':cogs===null?'':p.net-cogs};}));
  add('Settlement Summary',[{'Settlement Start':r.periodStart,'Settlement End':r.periodEnd,'Order Payments':r.totals.orderPayments,'Refunds':r.totals.refunds,'Other Amounts':r.totals.otherAmounts,'Net Settlement':r.totals.net,'Source Rows':(r.rawRows||[]).length}]);
  add('Raw Flat File',r.rawRows||[]);
  XLSX.writeFile(wb,'amazon-settlement-'+r.periodStart+'_'+r.periodEnd+'.xlsx');
}

// ---------- init ----------
async function init(){
  state.costCatalog = await loadCostCatalog();
  state.otherChargesCatalog = await loadOtherCharges();
  state.productGroups = await loadGroups();
  state.combos = await loadCombos();
  state.orderCompositions = await loadOrderCompositions();
  state.pendingGroupRules = await loadPendingGroups();
  await refresh();
}
init();

})();
</script>
